# Horizon Render non sta più su Netlify (ora è su Cloudflare, con l'accesso dei venditori).
# Se il vecchio sito Netlify è ancora collegato a questo repository, pubblica solo una pagina
# che rimanda al nuovo indirizzo: così non resta aperta una copia del sito senza accesso.
[build]
  publish = "netlify-chiuso"
  command = "echo Sito spostato su Cloudflare"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
