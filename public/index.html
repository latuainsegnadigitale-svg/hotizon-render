<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizon Render</title>
<meta name="description" content="Horizon Render: mostra al cliente la sua attività con l'insegna LED già montata e accesa.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D0718">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Horizon Render">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@600&family=Playfair+Display:wght@700&family=Montserrat:wght@400;800&family=Anton&family=Fredoka:wght@700&family=Pacifico&family=Cinzel:wght@700&family=Poppins:wght@700&family=Alfa+Slab+One&family=Orbitron:wght@700&family=Cormorant+Garamond:wght@700&family=Bebas+Neue&family=Dancing+Script:wght@700&family=Oswald:wght@600&family=Abril+Fatface&family=Teko:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050102; --plum:#34012C; --plum-2:#1D0718; --plum-3:#12040F;
  --violet:#6D40A3; --violet-hi:#A47FDD; --violet-glow:rgba(109,64,163,.38);
  --text:#FFFFFF; --dim:rgba(255,255,255,.68); --faint:rgba(255,255,255,.14);
  --panel:rgba(255,255,255,.045); --panel-2:rgba(255,255,255,.05); --border:rgba(255,255,255,.1); --border-strong:rgba(255,255,255,.26);
  --on-white:#2A0524; --sel-bg:rgba(109,64,163,.24);
  --warn-bg:rgba(255,179,71,.12); --warn-ink:#FFE2B3; --warn-line:#FFB347;
  --danger:#C23B5A;
  --bezel:#050102;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  background:var(--ink);
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:transparent;color:var(--text);font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%;}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(to top right,#34012C 0%,#1D0718 42%,#0A0208 74%,#050102 100%);}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.3px);background-size:7px 7px;}
img{max-width:100%;}
button{font:inherit;color:inherit;}
a{color:var(--violet-hi);}
.app{max-width:680px;margin:0 auto;padding:10px 16px 24px;}

/* intestazione con marchio */
.topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin:4px 0 16px;}
.brandbar{display:flex;align-items:center;justify-content:center;min-width:0;}
.brand-mark{height:30px;width:auto;display:block;}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:1.25rem;cursor:pointer;color:#fff;}
.icon-btn:hover{border-color:var(--border-strong);}
.icon-btn:focus-visible,.btn:focus-visible,.pill:focus-visible,.seg-btn:focus-visible,.sign-card:focus-visible,.dur-card:focus-visible,.trans-item:focus-visible,.dropzone:focus-visible,.frame-drop:focus-visible,.px-tile:focus-visible,.tl-thumb:focus-visible,.tl-trans button:focus-visible,.dd-btn:focus-visible,.dd-opt:focus-visible{outline:2px solid var(--violet-hi);outline-offset:2px;}
.page-title{font-size:1.55rem;line-height:1.2;font-weight:600;margin:6px 2px 14px;letter-spacing:-0.015em;}

/* passi: cinque tratti sottili */
.stepper{margin:0 2px 6px;}
.st-bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.st-bar{height:3px;border-radius:2px;background:var(--faint);}
.st-bar.done{background:var(--violet-hi);}
.st-bar.active{background:#fff;}
.st-text{margin:8px 0 0;font-size:.8rem;color:var(--dim);font-weight:500;}

/* home */
.hero{position:relative;isolation:isolate;text-align:center;padding:34px 4px 30px;}
.hero::before{content:"";position:absolute;z-index:-1;left:50%;bottom:-6px;width:130%;height:150px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 100%,var(--violet-glow),transparent 68%);pointer-events:none;}
.hero-logo{width:min(88%,420px);height:auto;display:block;margin:0 auto 16px;}
.horizon-line{height:1px;width:64%;margin:0 auto 18px;background:linear-gradient(90deg,transparent,rgba(164,127,221,.75),transparent);}
.tagline{margin:0 auto 24px;color:var(--dim);max-width:32ch;font-size:1.04rem;}
.foot{text-align:center;color:var(--dim);font-size:.78rem;margin:22px 0 6px;}
.spot-list{list-style:none;margin:0;padding:0;display:grid;gap:10px;}
.spot-item{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--panel-2);}
.spot-thumb{height:58px;border-radius:6px;overflow:hidden;background:var(--bezel);border:3px solid var(--bezel);display:flex;align-items:center;justify-content:center;}
.spot-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.spot-meta strong{display:block;font-size:1rem;font-weight:600;}
.spot-meta small{color:var(--dim);font-size:.8rem;}
.spot-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;}

/* pannelli */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px 16px;margin-bottom:12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.panel h2{font-size:1.06rem;margin:0 0 4px;font-weight:600;}
.panel h3{font-size:.92rem;margin:18px 0 8px;font-weight:600;}
.hint{color:var(--dim);font-size:.88rem;margin:0 0 14px;}
.hint.small{font-size:.8rem;margin:8px 0 0;}
.center{text-align:center;}
.note{color:var(--dim);font-size:.8rem;margin:14px 0 0;}
.progress-note{color:var(--dim);font-size:.86rem;margin:-6px 2px 14px;}

/* bottoni */
.btn{appearance:none;border:none;cursor:pointer;padding:13px 18px;border-radius:12px;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;}
.btn:active{transform:scale(.985);}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;}
.btn-primary{background:#fff;color:var(--on-white);}
.btn-secondary{background:rgba(255,255,255,.05);color:#fff;border:1.5px solid var(--border-strong);}
.btn-ghost{background:transparent;color:var(--dim);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:9px 13px;min-height:40px;font-size:.86rem;}
.btn-lg{min-height:54px;font-size:1.05rem;}
.btn-block{width:100%;}
.btn small{font-weight:500;opacity:.75;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.btn-offers{background:var(--violet);color:#fff;border:1.5px solid var(--violet-hi);box-shadow:0 8px 24px var(--violet-glow);text-decoration:none;}
.btn-offers:hover{background:#7A4BB4;}
.btn-offers .arr{font-size:1.1em;line-height:1;}
.offers-next{border-color:rgba(164,127,221,.45);background:radial-gradient(120% 90% at 50% 0%,rgba(109,64,163,.22),transparent 70%),var(--panel);}
.offers-next p{margin:4px 0 12px;}
a.btn{box-sizing:border-box;}
.btn-row.center{justify-content:center;}
.btn-row.end{justify-content:flex-end;}
.actionbar{position:sticky;bottom:0;z-index:5;display:flex;gap:8px;margin:4px -16px 0;padding:14px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(5,1,2,0),rgba(5,1,2,.94) 34%);}
.actionbar .btn{flex:1;}

/* scelta del formato */
.sign-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.sign-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px 12px;border-radius:14px;border:1.5px solid var(--border);background:var(--panel-2);cursor:pointer;text-align:center;color:#fff;}
.sign-card:hover{border-color:var(--border-strong);}
.sign-card.selected{border-color:var(--violet-hi);background:var(--sel-bg);}
.sign-stage{height:98px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
.sign-shape{background:var(--bezel);border-radius:4px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.4);}
.sign-shape i{display:block;width:100%;height:100%;border-radius:2px;background:linear-gradient(to bottom,transparent 0 60%,rgba(164,127,221,.9) 60% calc(60% + 1.5px),rgba(109,64,163,.28) calc(60% + 1.5px)),linear-gradient(135deg,#34012C,#050102);}
.sign-card strong{font-size:1rem;font-weight:600;}
.sign-card span{font-size:.78rem;color:var(--dim);}

/* brand */
.input{width:100%;padding:12px 13px;border-radius:10px;border:1.5px solid var(--border);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:1rem;}
.input::placeholder{color:rgba(255,255,255,.4);}
.input:focus-visible{outline:2px solid var(--violet-hi);outline-offset:1px;border-color:transparent;}
.lbl{display:flex;align-items:baseline;gap:8px;font-size:.9rem;font-weight:600;margin:14px 0 6px;}
.lbl .opt{font-weight:500;color:var(--dim);font-size:.8rem;}
.counter{margin-left:auto;font-weight:500;font-size:.78rem;color:var(--dim);font-variant-numeric:tabular-nums;}
.dropzone{width:100%;border:1.5px dashed var(--border-strong);border-radius:12px;padding:22px 14px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;}
.dropzone:hover{border-color:var(--violet-hi);}
.dz-ico{font-size:1.5rem;}
.dropzone small,.frame-drop small{color:var(--dim);font-size:.8rem;}
.logo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.logo-box{width:84px;height:84px;border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:10px;}
.logo-box img{max-width:100%;max-height:100%;object-fit:contain;}
.swatch-row{display:flex;gap:18px;flex-wrap:wrap;}
.swatch-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.swatch{position:relative;width:48px;height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.3);overflow:hidden;display:block;}
.swatch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:none;padding:0;}
.swatch-item small{font-size:.78rem;color:var(--dim);}

/* elenco a discesa: stile delle scritte */
.dd{position:relative;}
.dd-btn{width:100%;display:grid;grid-template-columns:1fr auto;grid-template-areas:"sample chev" "name chev";align-items:center;column-gap:12px;row-gap:6px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border-strong);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;text-align:left;}
.dd-btn .dd-stage{grid-area:sample;}
.dd-btn .dd-name{grid-area:name;}
.dd-btn .dd-chev{grid-area:chev;}
.dd-name{font-size:.82rem;color:var(--dim);font-weight:500;}
.dd-chev{width:9px;height:9px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);margin:0 4px 4px 0;display:block;}
.dd.open .dd-chev{transform:rotate(-135deg);margin:4px 4px 0 0;}
.dd-list{margin:8px 0 0;padding:6px;border:1px solid var(--border);border-radius:14px;background:rgba(23,5,20,.97);max-height:360px;overflow:auto;display:grid;gap:2px;}
.dd-list[hidden]{display:none;}
.dd-opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;padding:8px 10px;border:none;border-radius:10px;background:transparent;color:#fff;cursor:pointer;text-align:left;}
.dd-opt:hover{background:rgba(255,255,255,.06);}
.dd-opt[aria-selected="true"]{background:var(--sel-bg);}
.dd-opt .dd-name{white-space:nowrap;}
.dd-stage{display:inline-block;justify-self:start;max-width:100%;padding:10px 14px;border-radius:9px;background:linear-gradient(120deg,#5b4a8a,#2d6b78 70%,#243f58);overflow:hidden;}
.dd-sample{display:inline-block;font-size:1.2rem;line-height:1.15;white-space:nowrap;color:#fff;}

/* durata */
.dur-grid{display:grid;gap:10px;}
.dur-card{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--panel-2);cursor:pointer;text-align:left;color:#fff;}
.dur-card:hover{border-color:var(--border-strong);}
.dur-card.selected{border-color:var(--violet-hi);background:var(--sel-bg);}
.dur-card strong{font-size:2rem;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;min-width:66px;}
.dur-card strong span{font-size:.8rem;font-weight:500;margin-left:2px;color:var(--dim);}
.dur-card > span{font-size:.92rem;color:var(--dim);}

/* cornice insegna */
.frame{margin:0 auto;background:var(--bezel);border-radius:10px;padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);}
.screen{position:relative;border-radius:3px;overflow:hidden;background:#000;}
.screen canvas{display:block;width:100%;height:100%;}
.screen canvas.draggable{cursor:grab;touch-action:none;}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(0,0,0,0) 55%,rgba(0,0,0,.2) 100%);}
.frame-drop{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:linear-gradient(135deg,#34012C,#0A0208);color:#fff;cursor:pointer;padding:10px;text-align:center;}

/* anteprima fissa in alto mentre si modifica */
.ed-stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin:0 -16px 12px;padding:10px 16px 8px;background:rgba(9,2,8,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.ed-stage .hint{margin:8px 0 0;}

/* pill e segmenti */
.pills{display:flex;flex-wrap:wrap;gap:8px;}
.pill{padding:8px 14px;border-radius:999px;border:1.5px solid var(--border-strong);background:transparent;cursor:pointer;font-size:.88rem;font-weight:600;color:#fff;}
.pill.selected{background:#fff;color:var(--on-white);border-color:#fff;}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.seg-btn{border:1.5px solid var(--border);background:var(--panel-2);border-radius:12px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.86rem;font-weight:600;color:#fff;}
.seg-btn:hover{border-color:var(--border-strong);}
.seg-btn.selected{border-color:var(--violet-hi);background:var(--sel-bg);}
.pos-ico{width:44px;height:30px;border-radius:4px;background:rgba(255,255,255,.14);position:relative;display:block;}
.pos-ico i{position:absolute;left:9px;right:9px;height:6px;border-radius:2px;background:#fff;}
.pos-top i{top:4px;} .pos-center i{top:12px;} .pos-bottom i{bottom:4px;}
.pos-manual i{top:7px;left:6px;right:20px;}
.pos-manual::after{content:"";position:absolute;right:6px;bottom:5px;width:9px;height:9px;border-radius:50%;border:2px solid var(--violet-hi);background:rgba(164,127,221,.35);}
.seg.seg-4{grid-template-columns:repeat(4,1fr);gap:6px;}
.seg.seg-4 .seg-btn{font-size:.78rem;padding:10px 4px;text-align:center;line-height:1.15;}
.pos-ico.promo i{left:12px;right:12px;height:7px;border-radius:4px;background:var(--violet-hi);}
.pos-ico.pos-with i{top:6px;background:#fff;}
.pos-ico.pos-with i + i{top:16px;left:13px;right:13px;height:6px;background:var(--violet-hi);}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-left:3px solid var(--warn-line);border-radius:10px;padding:10px 12px;font-size:.86rem;margin:12px 0 0;}

/* transizioni */
.choice-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--panel-2);}
.choice-val{min-width:0;}
.choice-val strong{display:block;font-size:1.02rem;font-weight:600;}
.choice-val small{display:block;color:var(--dim);font-size:.8rem;}
.trans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media (min-width:520px){ .trans-grid{grid-template-columns:repeat(4,1fr);} }
.trans-item{border:1.5px solid var(--border);background:var(--panel-2);border-radius:12px;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.76rem;font-weight:600;text-align:center;line-height:1.2;color:#fff;}
.trans-item:hover{border-color:var(--border-strong);}
.trans-item canvas{width:100%;aspect-ratio:3/2;border-radius:6px;display:block;background:#000;}
.trans-item.selected{border-color:var(--violet-hi);background:var(--sel-bg);}
.trans-item .mix-ico{width:100%;aspect-ratio:3/2;border-radius:6px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6D40A3,#34012C);}
.trans-item .mix-ico svg{width:34%;height:auto;}

/* definizione video */
.def-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin:14px 0 8px;}
.def-row label{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--dim);font-weight:500;}
.def-x{padding-bottom:13px;color:var(--dim);font-size:1.1rem;}
.def-line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:.84rem;color:var(--dim);}
.def-line strong{color:#fff;font-weight:600;}

/* player e sequenza */
.player-ctrl{display:flex;align-items:center;gap:10px;margin-top:12px;}
.player-ctrl input[type=range]{flex:1;accent-color:var(--violet-hi);}
.time{font-size:.8rem;color:var(--dim);font-variant-numeric:tabular-nums;min-width:80px;text-align:right;}
.led-toggle{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:.86rem;font-weight:500;cursor:pointer;}
.led-toggle input{width:18px;height:18px;accent-color:var(--violet-hi);}
.tl{list-style:none;margin:0;padding:0;}
.tl-card{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--panel-2);}
.tl-thumb{width:64px;height:44px;border-radius:6px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;padding:0;}
.tl-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.tl-thumb.logo img{object-fit:contain;padding:4px;}
.tl-body{min-width:0;}
.tl-body strong{display:block;font-size:.95rem;font-weight:600;}
.tl-body small{display:block;color:var(--dim);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tl-body .tl-warn{color:var(--warn-ink);background:var(--warn-bg);display:inline-block;border-radius:6px;padding:1px 6px;margin-top:4px;font-size:.74rem;}
.tl-actions{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;}
.tl-actions .btn{min-height:36px;padding:7px 11px;font-size:.82rem;}
.tl-trans{display:flex;justify-content:center;padding:6px 0;position:relative;}
.tl-trans::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--border);}
.tl-trans button{position:relative;border:1.5px solid var(--border-strong);background:#150513;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600;cursor:pointer;color:#fff;}
.tl-trans button:hover{border-color:var(--violet-hi);}

/* ricerca online */
.px-search{display:flex;gap:8px;}
.px-search .input{flex:1;}
.px-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;}
.px-tile{border:none;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:1;background:rgba(255,255,255,.06);cursor:pointer;}
.px-tile img{width:100%;height:100%;object-fit:cover;display:block;}
.px-grid.busy{opacity:.4;pointer-events:none;}
.px-kind{margin-bottom:10px;grid-template-columns:repeat(2,1fr);}
.px-tile{position:relative;}
.px-src{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.72);color:#fff;font-size:.62rem;font-weight:700;padding:1px 5px;border-radius:5px;}
.px-dur{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;font-size:.72rem;font-weight:700;padding:2px 6px;border-radius:6px;}
.px-credit{font-size:.78rem;color:var(--dim);text-align:center;margin:14px 0 0;}

/* modali e fogli */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,1,2,.7);display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#1A0617;border:1px solid var(--border);border-radius:18px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:calc(100% - 32px);overflow:auto;}
.modal h3{margin:0 0 8px;font-size:1.12rem;font-weight:600;}
.modal p{margin:0 0 8px;color:var(--dim);font-size:.92rem;}
.modal-logo{height:26px;width:auto;display:block;margin:0 0 14px;}
.modal .btn-row{margin-top:16px;}
.sheet-overlay{align-items:flex-end;padding:0;}
.sheet{background:#1A0617;border:1px solid var(--border);border-bottom:none;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:680px;max-height:86%;overflow:auto;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.sheet-head h3{margin:0;font-size:1.06rem;font-weight:600;}
.progress{height:6px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin:14px 0 8px;}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--violet-hi));}
.file-name{font-weight:600;word-break:break-all;margin:6px 0 2px;font-size:.94rem;color:#fff !important;}
.howto{background:rgba(255,255,255,.06);border-radius:12px;padding:12px 14px;margin:14px 0 6px;font-size:.88rem;}
.howto ol{margin:6px 0 0;padding-left:20px;}
.howto li{margin:2px 0;}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#fff;color:var(--on-white);font-weight:600;padding:11px 16px;border-radius:12px;font-size:.9rem;max-width:calc(100% - 32px);z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast.show{opacity:1;transform:translate(-50%,0);}
/* ritaglio e controlli nuovi */
.ed-tools{display:flex;justify-content:center;margin-top:10px;}
.btn .ico{width:16px;height:16px;flex:none;}
.crop-sheet{max-height:94%;}
.crop-stage{display:flex;justify-content:center;align-items:center;margin:12px 0 4px;min-height:200px;}
.crop-stage canvas{display:block;border-radius:8px;touch-action:none;cursor:move;background:#000;}
.crop-stage canvas.static{cursor:default;}
.crop-actions{display:flex;gap:8px;align-items:center;margin-top:12px;}
.crop-spacer{flex:1;}
.panel h2 .opt{font-weight:500;font-size:.78rem;color:var(--dim);margin-left:6px;}
.btn-row.tight{margin:0;}
.warn-text{color:var(--warn-ink);}
.logo-box img{display:block;}
::selection{background:rgba(164,127,221,.45);color:#fff;}
.input{caret-color:var(--violet-hi);}
html{scrollbar-color:rgba(164,127,221,.45) transparent;}
.hero{overflow-x:clip;}
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);}
@media (prefers-reduced-motion:no-preference){
  .btn,.seg-btn,.pill,.size-card,.dur-card,.trans-item,.dd-btn,.icon-btn,.px-tile,.tl-thumb,.struct-card{transition:transform 160ms var(--ease-out),background-color 150ms ease,border-color 150ms ease,color 150ms ease;}
  .btn:active,.seg-btn:active,.pill:active,.size-card:active,.dur-card:active,.trans-item:active,.icon-btn:active,.px-tile:active,.tl-thumb:active,.struct-card:active{transform:scale(.97);}
  .app.view-in{animation:viewIn 220ms var(--ease-out);}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .overlay{animation:fadeIn 180ms ease;}
  .overlay .modal{animation:modalIn 200ms var(--ease-out);}
  .sheet-overlay .sheet{animation:sheetIn 300ms var(--ease-drawer);}
  @keyframes fadeIn{from{opacity:0;}}
  @keyframes modalIn{from{opacity:0;transform:scale(.96);}}
  @keyframes sheetIn{from{transform:translateY(100%);}}
  .st-bar{transition:background-color 250ms ease;}
  .lockup{animation:heroIn 700ms var(--ease-out) both;}
  .horizon-line{animation:lineIn 900ms var(--ease-out) 150ms both;transform-origin:center;}
  @keyframes heroIn{from{opacity:0;filter:blur(6px);transform:translateY(8px);}}
  @keyframes lineIn{from{transform:scaleX(0);opacity:0;}}
}
@media (prefers-reduced-motion:reduce){ .overlay{animation:fadeIn 150ms ease;} @keyframes fadeIn{from{opacity:0;}} }
@media (prefers-reduced-motion:no-preference){
  .toast{transition:opacity .2s ease,transform .2s ease;}
  .progress-fill{transition:width .15s linear;}
  .dd-chev{transition:transform .15s ease,margin .15s ease;}
}
/* ===== Horizon Render: aggiunte ===== */
.st-bars{grid-template-columns:repeat(6,1fr);}
.lockup{position:relative;width:min(88%,420px);margin:0 auto 16px;container-type:inline-size;}
.lockup img{width:100%;height:auto;display:block;}
.lockup span{position:absolute;right:32%;top:55.6%;font-family:"Montserrat","Instrument Sans",sans-serif;font-weight:400;font-size:13.8cqw;line-height:.72;letter-spacing:-.005em;color:#fff;white-space:nowrap;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.render-thumb{width:84px;aspect-ratio:4/3;height:auto;}
.panel-prev{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:170px;}
.panel-dims{margin:0;text-align:center;display:flex;flex-direction:column;gap:2px;}
.panel-dims strong{font-size:1.15rem;font-weight:600;}
.panel-dims span{font-size:.82rem;color:var(--dim);}
.size-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media (min-width:520px){ .size-grid{grid-template-columns:repeat(4,1fr);} }
.size-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;border-radius:14px;border:1.5px solid var(--border);background:var(--panel-2);cursor:pointer;color:#fff;}
.size-card:hover{border-color:var(--border-strong);}
.size-card.selected{border-color:var(--violet-hi);background:var(--sel-bg);}
.size-card strong{font-size:1.08rem;font-weight:600;font-variant-numeric:tabular-nums;}
.size-card span{font-size:.78rem;color:var(--dim);}
.seg.seg-2{grid-template-columns:repeat(2,1fr);}
/* logo dell'attività */
.brand-logo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand-logo .logo-box{width:96px;height:72px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.92);overflow:hidden;flex:none;}
.brand-logo .logo-box img{max-width:86%;max-height:80%;object-fit:contain;}
.found{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.found button{width:40px;height:40px;border-radius:10px;border:1.5px solid rgba(255,255,255,.25);cursor:pointer;padding:0;}
.found button.on{border-color:#fff;box-shadow:0 0 0 2px var(--violet-hi);}

/* sfondo a tinta unita */
.sol-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.sol-sw{width:38px;height:38px;border-radius:10px;border:1.5px solid rgba(255,255,255,.22);cursor:pointer;padding:0;transition:transform 140ms var(--ease-out,ease),border-color 140ms ease;}
.sol-sw:active{transform:scale(.94);}
.sol-sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--violet-hi);}
.sol-shades{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:6px;}
.sol-shades .sol-sw{width:100%;height:34px;border-radius:7px;}
.sol-custom{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.9rem;color:var(--dim);}
.sol-custom input[type=color]{width:46px;height:36px;border:1.5px solid rgba(255,255,255,.25);border-radius:9px;background:none;padding:2px;cursor:pointer;}
.sol-prev{height:10px;border-radius:6px;margin-top:10px;border:1px solid rgba(255,255,255,.18);}

/* caselle di testo in più */
textarea.input{min-height:78px;resize:vertical;line-height:1.35;display:block;}
.bx-list{display:grid;gap:12px;margin-top:12px;}
.bx-card{padding:12px;border-radius:14px;border:1.5px solid var(--border);background:rgba(255,255,255,.035);transition:border-color 150ms ease;}
.bx-card.on{border-color:var(--violet-hi);}
.bx-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.bx-head strong{font-size:.92rem;}
.bx-card .seg{margin-top:6px;}
.bx-card .lbl{margin-top:10px;}

.seg-btn small{font-weight:500;font-size:.74rem;color:var(--dim);}
.orient-ico{display:block;background:var(--bezel);border:2px solid rgba(255,255,255,.55);border-radius:3px;}
.orient-ico.h{width:40px;height:28px;margin:6px 0;} .orient-ico.v{width:28px;height:40px;}
.range-row{display:flex;align-items:center;gap:12px;}
.range-row input{flex:1;accent-color:var(--violet-hi);}
.range-row output{min-width:48px;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);font-size:.85rem;}
.swatch-inline{flex-direction:row;align-items:center;gap:12px;}
.swatch-inline small{max-width:30ch;}
.place-wrap{display:flex;justify-content:center;margin:0 0 8px;}
.place-canvas{display:block;border-radius:12px;touch-action:none;cursor:grab;background:#000;box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);}
.place-canvas.drawing{cursor:crosshair;}
.place-hint{min-height:2.6em;margin:6px 4px 12px;}
.meta-line{font-size:.86rem;color:var(--dim);margin:0 0 12px;}
.meta-line strong{color:#fff;font-weight:600;}
.tool-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.choice-ico svg{width:44px;height:44px;display:block;}
.choice-row .choice-val{flex:1;}
.struct-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media (min-width:560px){ .struct-grid{grid-template-columns:repeat(3,1fr);} }
.struct-card{border:1.5px solid var(--border);background:var(--panel-2);border-radius:14px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;color:#fff;}
.struct-card:hover{border-color:var(--border-strong);}
.struct-card.selected{border-color:var(--violet-hi);background:var(--sel-bg);}
.struct-card svg{width:64px;height:64px;margin-bottom:4px;}
.struct-card strong{font-size:.92rem;font-weight:600;}
.struct-card span{font-size:.76rem;color:var(--dim);line-height:1.3;}
.pill-dot{display:inline-flex;align-items:center;gap:8px;}
.pill-dot i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.5);display:block;}
.render-panel{padding:10px;}
.render-frame{border-radius:12px;overflow:hidden;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.06);}
.render-frame canvas{display:block;width:100%;height:auto;}
.render-panel .player-ctrl{padding:0 6px 4px;}
.check-row{display:flex;align-items:flex-start;gap:10px;margin-top:14px;font-size:.9rem;cursor:pointer;}
.check-row input{width:18px;height:18px;margin-top:2px;accent-color:var(--violet-hi);flex:none;}
.size-card:focus-visible,.struct-card:focus-visible,.place-canvas:focus-visible{outline:2px solid var(--violet-hi);outline-offset:2px;}

</style>

<script>
(function(){
'use strict';

/* =====================================================================
   CONFIGURAZIONE — modifica qui misure, passi LED, stili e durate
   ===================================================================== */

const PX_CACHE_MS = 24*60*60*1000;
const IN_CLAUDE = !!window.claude || /claude\.ai|claudeusercontent|anthropic/.test(location.hostname);

// Stili delle scritte (semplici). "box" = come è incorniciata la scritta.

const FONT_STYLES = {

const easeOutBack = t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3*Math.pow(t - 1, 3) + c1*Math.pow(t - 1, 2); };

function panelCm(p){ const P = p.panel || { a:100, b:75, orient:'h' }; return P.orient === 'v' ? { w:P.b, h:P.a } : { w:P.a, h:P.b }; }
function ledRes(p){
  const c = panelCm(p), pitch = (p.panel && p.panel.pitch) || DEFAULT_PITCH;
  return { w: clamp(Math.round(c.w*10/pitch), 16, LED_MAX), h: clamp(Math.round(c.h*10/pitch), 16, LED_MAX) };

const signOf = p => { const r = ledRes(p); return makeSign(r.w, r.h); };
const transLabel = id => (TRANSITIONS.find(t => t.id === id) || TRANSITIONS[0]).label;
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };

function analyzeLogo(src){
  const w = 80, h = Math.max(1, Math.round(80 * src.height / src.width));
  const c = makeCanvas(w, h), x = c.getContext('2d'); x.drawImage(src, 0, 0, w, h);
  let d; try { d = x.getImageData(0, 0, w, h).data; } catch (e){ return { bg:null, colors:[], lum:.5 }; }
  const px = (i, j) => { const k = (j*w + i)*4; return [d[k], d[k+1], d[k+2], d[k+3]]; };
  const cs = [px(0,0), px(w-1,0), px(0,h-1), px(w-1,h-1)];
  let bg = null;
  if (cs.every(q => q[3] > 220)){
    const avg = [0,1,2].map(k => cs.reduce((t, q) => t + q[k], 0) / 4);
    const spread = Math.max.apply(null, cs.map(q => Math.abs(q[0]-avg[0]) + Math.abs(q[1]-avg[1]) + Math.abs(q[2]-avg[2])));
    if (spread < 60) bg = avg;
  }
  const buckets = new Map();
  for (let k = 0; k < d.length; k += 4){
    const r = d[k], g = d[k+1], b = d[k+2], a = d[k+3];
    if (a < 140) continue;
    if (bg && Math.abs(r-bg[0]) + Math.abs(g-bg[1]) + Math.abs(b-bg[2]) < 60) continue;
    const hsl = rgbToHsl(r, g, b);
    if (hsl[1] < .2 || hsl[2] < .1 || hsl[2] > .92) continue;
    const key = Math.round(hsl[0]*24) + '|' + Math.round(hsl[2]*4);
    const cur = buckets.get(key) || { n:0, r:0, g:0, b:0 };
    cur.n++; cur.r += r; cur.g += g; cur.b += b; buckets.set(key, cur);

    const col = [bk.r/bk.n, bk.g/bk.n, bk.b/bk.n]; const hh = rgbToHsl(col[0], col[1], col[2])[0];
    if (picked.every(q => hueDist(q.h, hh) > .07)) picked.push({ h: hh, hex: rgbToHex(col[0], col[1], col[2]).toUpperCase() });
    if (picked.length >= 4) break;

/* =====================================================================

   ===================================================================== */
const DB = {
  db: null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('horizon-render', 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath:'id' });
          if (!db.objectStoreNames.contains('media')) db.createObjectStore('media', { keyPath:'id' });
        };
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      } catch (e){ rej(e); }
    });
  },
  async run(mode, fn, store){
    store = store || 'projects';
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode); const req = fn(tx.objectStore(store)); let out;
      if (req) req.onsuccess = () => { out = req.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  all(){ return this.run('readonly', st => st.getAll()); },
  put(p){ return this.run('readwrite', st => st.put(p)); },
  del(id){ return this.run('readwrite', st => st.delete(id)); }
};

const imgCache = new Map(), imgReady = new Map();
function loadImg(src){
  if (!src) return Promise.resolve(null);
  if (imgCache.has(src)) return imgCache.get(src);
  const pr = new Promise(res => { const i = new Image(); i.onload = () => { imgReady.set(src, i); res(i); }; i.onerror = () => res(null); i.src = src; });

}

async function getMedia(id){

    if (project) project.slides.forEach(s => { if (s.videoId) used.add(s.videoId); });
    const keys = (await DB.run('readonly', st => st.getAllKeys(), 'media')) || [];
    for (const k of keys) if (!used.has(k)){ await DB.run('readwrite', st => st.delete(k), 'media'); mediaMem.delete(k); }
  } catch (e){}
}

function waitVideo(v, ms){

    if (v.readyState >= 2) return res(v);
    const ok = () => { clean(); res(v); }, ko = () => { clean(); rej(new Error('video')); };
    const to = setTimeout(ko, ms || 12000);

    v.addEventListener('loadeddata', ok); v.addEventListener('error', ko);
    try { v.load(); } catch (e){}
  });

    let done = false; const fin = () => { if (done) return; done = true; v.removeEventListener('seeked', fin); clearTimeout(to); res(); };
    v.addEventListener('seeked', fin); const to = setTimeout(fin, 2000);
    try { v.currentTime = time; } catch (e){ fin(); }
  });

}

  await waitVideo(el, 20000);

  await seekVideo(el, Math.min(.5, el.duration/2));

    if (playing){
      if (el.paused){ try { el.currentTime = v.time; } catch (e){} const pr = el.play(); if (pr && pr.catch) pr.catch(() => {}); }
      else { const drift = Math.abs(el.currentTime - v.time); if (drift > .35 && drift < el.duration - .35){ try { el.currentTime = v.time; } catch (e){} } }
    } else {
      if (!el.paused) el.pause();

    '<div class="player-ctrl"><button class="icon-btn" id="pl-play" aria-label="Pausa">❚❚</button><input type="range" id="pl-seek" min="0" max="' + p.duration + '" step="0.01" value="0" aria-label="Posizione nel video"><span class="time" id="pl-time">0:00 / ' + fmtTime(p.duration) + '</span></div></section>' +
    '<section class="panel"><h2>Effetto LED</h2>' +
    '<p class="lbl">Luminosità e bagliore</p><div class="range-row"><input type="range" id="glow" min="0" max="100" step="1" value="' + p.fx.glow + '" aria-label="Luminosità e bagliore"><output id="glow-v">' + p.fx.glow + '%</output></div>' +
    '<p class="lbl">Foto dell\'attività</p><div class="seg" id="bg">' + BG_MODES.map(m => '<button type="button" class="seg-btn' + (p.fx.bg === m.id ? ' selected' : '') + '" data-v="' + m.id + '">' + m.label + '</button>').join('') + '</div>' +
    '<p class="hint small">Con la foto più scura la luce del pannello risalta di più, come all\'imbrunire.</p>' +
    '<label class="check-row"><input type="checkbox" id="pix"' + (p.fx.pixels ? ' checked' : '') + '> Pixel LED visibili quando il pannello è grande nella foto</label>' +
    '<label class="check-row"><input type="checkbox" id="sheen"' + (p.fx.sheen ? ' checked' : '') + '> Riflesso leggero sul pannello</label></section>' +
    '<section class="panel"><h2>Video</h2><div class="seg seg-2" id="qual">' + QUALITIES.map(q => { const d = dimsOf(q); return '<button type="button" class="seg-btn' + (p.quality === q.id ? ' selected' : '') + '" data-v="' + q.id + '">' + q.label + '<small>' + d.W + ' × ' + d.H + '</small></button>'; }).join('') + '</div>' +
    '<p class="meta-line">MP4 da ' + p.duration + ' secondi, senza audio, nel formato della foto. Si apre su qualsiasi telefono.</p>' +
    '<div class="btn-row"><button class="btn btn-secondary btn-sm" id="to-place">Sposta l\'insegna</button><button class="btn btn-secondary btn-sm" id="to-spot">Modifica lo spot</button><button class="btn btn-secondary btn-sm" id="spot-dl">Scarica solo lo spot</button></div></section>' +
    '<section class="panel offers-next"><h2>Prossimo passo: l\'offerta</h2><p class="hint small">Apri Horizon Offers con le misure di questa insegna (' + panelLabel(p) + ') e mostra al cliente i tre piani.</p>' + offersBtn(p, 'to-offers') + '</section>' +
    '<div class="actionbar"><button class="btn btn-primary btn-block" id="export">Esporta il render</button></div>';
  bindTopbar(async () => { await saveNow(); go('place'); });
  $('#to-offers').addEventListener('click', () => { saveNow(); });

  const cv = $('#rc'), ctx = cv.getContext('2d'), seek = $('#pl-seek'), time = $('#pl-time'), playBtn = $('#pl-play');
  const R = makeRender(p, pv.W, pv.H, img, Math.min(2, exportScale(signOf(p))));
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pl = { t: 0, playing: !reduce, last: performance.now(), dirty: true, raf: 0, stopped: false };
  const segs = R.segs, hasVid = p.slides.some(x => videoOf(x));
  if (hasVid) videoStates(p, segs, 0).forEach(v => v.el.addEventListener('seeked', () => { if (player === pl) pl.dirty = true; }));
  let thumbDone = false;
  const setPlayIcon = () => { playBtn.textContent = pl.playing ? '❚❚' : '▶'; playBtn.setAttribute('aria-label', pl.playing ? 'Pausa' : 'Riproduci'); };
  const loop = (now) => {
    if (pl.stopped) return;
    const dt = Math.min(.1, (now - pl.last)/1000); pl.last = now;
    if (pl.playing){ pl.t += dt; if (pl.t >= p.duration) pl.t -= p.duration; pl.dirty = true; }
    if (hasVid){ syncVideos(p, segs, pl.t, pl.playing); if (!pl.playing && videoStates(p, segs, pl.t).some(v => v.active && v.el.seeking)) pl.dirty = true; }
    if (pl.dirty){
      compositeFrame(ctx, R, pl.t); seek.value = pl.t.toFixed(2); time.textContent = fmtTime(pl.t) + ' / ' + fmtTime(p.duration); pl.dirty = false;
      if (!thumbDone && pl.t > 1.6){ thumbDone = true; try { const k = 240 / Math.max(pv.W, pv.H), tc = makeCanvas(Math.round(pv.W*k), Math.round(pv.H*k)); tc.getContext('2d').drawImage(cv, 0, 0, tc.width, tc.height); p.thumb = tc.toDataURL('image/jpeg', .8); touch(); } catch (e){} }
    }
    pl.raf = requestAnimationFrame(loop);
  };
  stopPlayer(); player = pl; setPlayIcon(); pl.raf = requestAnimationFrame(loop);
  playBtn.onclick = () => { pl.playing = !pl.playing; pl.last = performance.now(); setPlayIcon(); };
  seek.oninput = () => { pl.t = +seek.value; pl.dirty = true; };
  $('#glow').oninput = e => { p.fx.glow = +e.target.value; $('#glow-v').textContent = p.fx.glow + '%'; pl.dirty = true; touch(); };
  $$('#bg .seg-btn').forEach(b => b.onclick = () => { p.fx.bg = b.dataset.v; $$('#bg .seg-btn').forEach(x => x.classList.toggle('selected', x === b)); rebuildBase(R); pl.dirty = true; touch(); });
  $('#pix').onchange = e => { p.fx.pixels = e.target.checked; pl.dirty = true; touch(); };
  $('#sheen').onchange = e => { p.fx.sheen = e.target.checked; pl.dirty = true; touch(); };
  $$('#qual .seg-btn').forEach(b => b.onclick = () => { p.quality = b.dataset.v; $$('#qual .seg-btn').forEach(x => x.classList.toggle('selected', x === b)); touch(); });
  $('#to-place').onclick = async () => { await saveNow(); go('place'); };
  $('#to-spot').onclick = async () => { await saveNow(); go('review'); };
  $('#spot-dl').onclick = () => runExport('spot');
  $('#export').onclick = () => runExport('render');
}

/* =====================================================================
   ESPORTAZIONE VIDEO
   ===================================================================== */
function baseName(p){ return (p.bizName || 'RENDER').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'RENDER'; }
async function exportSpot(p, onProg){
  await loadAssets(p); await ensureFonts(p);
  const sign = signOf(p), W = sign.w, H = sign.h, S = exportScale(sign);
  const hi = makeCanvas(W*S, H*S), hctx = hi.getContext('2d'), out = makeCanvas(W, H), octx = out.getContext('2d');
  const segs = timeline(p);
  const drawFrame = t => { renderAt(hctx, W*S, H*S, t, p, segs); octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = 'high'; octx.fillStyle = '#000'; octx.fillRect(0, 0, W, H); octx.drawImage(hi, 0, 0, W, H); };
  const res = await encodeVideo(p, segs, out, drawFrame, W, H, onProg, Math.max(900000, Math.round(W*H*FPS*1.2)), ['avc1.42001f', 'avc1.4d001f', 'avc1.640028', 'avc1.42E01E']);
  return Object.assign(res, { W, H, name: baseName(p) + '_SPOT_' + p.duration + 'S_' + W + 'X' + H + '.' + res.ext });
}
async function exportRender(p, onProg){
  await loadAssets(p); await ensureFonts(p); await ensureBrandFont();
  const img = await loadImg(p.site.photo), q = QUALITIES.find(x => x.id === p.quality) || QUALITIES[1];
  const { W, H } = siteDims(img, q.long);
  const R = makeRender(p, W, H, img), out = makeCanvas(W, H), octx = out.getContext('2d');
  const drawFrame = t => compositeFrame(octx, R, t);
  const res = await encodeVideo(p, R.segs, out, drawFrame, W, H, onProg, Math.round(clamp(W*H*FPS*.12, 3e6, 14e6)), ['avc1.640033', 'avc1.4d0033', 'avc1.640032', 'avc1.640028', 'avc1.42E033', 'avc1.42001f']);
  return Object.assign(res, { W, H, name: baseName(p) + '_RENDER_' + W + 'X' + H + '.' + res.ext });
}
async function encodeVideo(p, segs, out, drawFrame, W, H, onProg, bitrate, codecs){
  const total = Math.round(p.duration * FPS);
  const hasVid = p.slides.some(s => videoOf(s));
  const beforeFrame = hasVid ? (t => seekVideosFor(p, segs, t)) : null;
  const liveSync = hasVid ? (t => syncVideos(p, segs, t, true)) : null;
  pauseAllVideos();
  if (window.VideoEncoder && window.VideoFrame && window.Mp4Muxer){
    try { return await exportWebCodecs(out, drawFrame, W, H, total, onProg, beforeFrame, bitrate, codecs); } catch (e){ console.warn('WebCodecs non riuscito, uso MediaRecorder', e); }
  }
  try { return await exportRecorder(out, drawFrame, p.duration, onProg, liveSync, Math.min(bitrate, 12e6)); } finally { pauseAllVideos(); }
}
async function exportWebCodecs(out, drawFrame, W, H, total, onProg, beforeFrame, bitrate, codecs){
  let config = null;
  for (const codec of codecs){
    const c = { codec, width:W, height:H, bitrate, framerate:FPS };
    try { const sup = await VideoEncoder.isConfigSupported(c); if (sup && sup.supported){ config = c; break; } } catch (e){}
  }
  if (!config) throw new Error('Codec H.264 non disponibile');
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec:'avc', width:W, height:H }, fastStart:'in-memory', firstTimestampBehavior:'offset' });
  let encErr = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { encErr = e; } });
  enc.configure(config);
  for (let i = 0; i < total; i++){
    if (encErr) throw encErr;
    if (beforeFrame) await beforeFrame(i / FPS);
    drawFrame(i / FPS);
    const frame = new VideoFrame(out, { timestamp: Math.round(i*1e6/FPS), duration: Math.round(1e6/FPS) });
    enc.encode(frame, { keyFrame: i % (FPS*2) === 0 }); frame.close();
    if (i % 4 === 0){ onProg(i/total); await new Promise(r => setTimeout(r, 0)); }
    while (enc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 4));
  }
  await enc.flush(); if (encErr) throw encErr;
  muxer.finalize(); enc.close(); onProg(1);
  return { blob: new Blob([muxer.target.buffer], { type:'video/mp4' }), ext:'mp4' };
}
function exportRecorder(out, drawFrame, dur, onProg, liveSync, bitrate){
  return new Promise((resolve, reject) => {
    if (typeof MediaRecorder === 'undefined' || !out.captureStream){ reject(new Error('Registrazione video non supportata')); return; }
    const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e){ return false; } });
    if (!mime){ reject(new Error('Nessun formato video disponibile')); return; }
    drawFrame(0);
    const rec = new MediaRecorder(out.captureStream(FPS), { mimeType:mime, videoBitsPerSecond:bitrate || 3000000 });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => resolve({ blob: new Blob(chunks, { type: mime.split(';')[0] }), ext: mime.indexOf('mp4') > -1 ? 'mp4' : 'webm' });
    rec.onerror = e => reject(e.error || new Error('Errore di registrazione'));
    rec.start(500);
    const t0 = performance.now();
    const loop = () => {
      const t = (performance.now() - t0)/1000;
      if (t >= dur){ drawFrame(dur - .001); onProg(1); setTimeout(() => rec.stop(), 150); return; }
      if (liveSync) liveSync(t);
      drawFrame(t); onProg(t/dur); requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}
let downloadsNS = null;
if (window.claude && typeof window.claude.use === 'function'){ window.claude.use('downloads').then(ns => { downloadsNS = ns; }).catch(() => {}); }
async function saveBlob(blob, filename){
  if (downloadsNS){
    try { await downloadsNS.save({ filename, data: blob }); return 'saved'; }
    catch (e){ if (e && e.code === 'declined') return 'declined'; if (e && e.code === 'rate_limited') return 'busy'; }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000); return 'saved';
}
async function runExport(kind){
  const p = project, back = view;
  stopPlayer();
  modalRoot.innerHTML = '<div class="overlay"><div class="modal" role="dialog" aria-modal="true" id="ex-modal"><img class="modal-logo" src="brand/mark-horizon.png" alt=""><h3>' + (kind === 'spot' ? 'Creo lo spot' : 'Creo il render') + '</h3><p>Resta su questa schermata finché non ha finito.</p><div class="progress"><div class="progress-fill" id="ex-fill"></div></div><p id="ex-status">0%</p></div></div>';
  const fill = $('#ex-fill'), status = $('#ex-status');
  try {
    const res = await (kind === 'spot' ? exportSpot : exportRender)(p, pr => { const v = Math.round(clamp(pr, 0, 1)*100); fill.style.width = v + '%'; status.textContent = v + '%'; });
    const file = (typeof File === 'function') ? new File([res.blob], res.name, { type: res.blob.type || 'video/mp4' }) : null;
    const canShare = !downloadsNS && file && navigator.canShare && (() => { try { return navigator.canShare({ files:[file] }); } catch (e){ return false; } })();
    const size = res.blob.size > 1048576 ? num((res.blob.size/1048576).toFixed(1)) + ' MB' : Math.max(1, Math.round(res.blob.size/1024)) + ' KB';
    $('#ex-modal').innerHTML = '<img class="modal-logo" src="brand/mark-horizon.png" alt=""><h3>' + (kind === 'spot' ? 'Lo spot è pronto' : 'Il render è pronto') + '</h3>' +
      '<p class="file-name">' + esc(res.name) + '</p><p>' + size + ', ' + res.W + ' × ' + res.H + ' px, ' + p.duration + ' secondi, senza audio.</p>' +
      (res.ext !== 'mp4' ? '<p class="warn">Questo browser ha creato il video in formato .webm. Per un MP4 riprova da Chrome aggiornato o da Safari su iPhone.</p>' : '') +
      '<button class="btn btn-primary btn-block" id="ex-dl">Scarica il video</button>' +
      (canShare ? '<button class="btn btn-secondary btn-block" id="ex-share" style="margin-top:8px">' + (kind === 'spot' ? 'Salva nella galleria o invia' : 'Invia al cliente') + '</button>' : '') +
      (kind === 'spot'
        ? '<div class="howto"><strong>Per pubblicarlo sull\'insegna</strong><ol><li>Accedi alla piattaforma di gestione dell\'insegna</li><li>Vai su Azione, poi Palinsesto, poi premi il tasto +</li><li>Sfoglia, scegli il video, imposta le date e premi Invia</li></ol></div>'
        : '<p class="hint small">Mandalo al cliente su WhatsApp o per email: vedrà la sua attività con l\'insegna già accesa.</p>' + '<div style="margin-top:10px">' + offersBtn(p, 'ex-offers') + '</div>') +
      '<button class="btn btn-ghost btn-block" id="ex-close">Chiudi</button>';
    $('#ex-dl').onclick = async () => { const r = await saveBlob(res.blob, res.name); if (r === 'saved') toast('Video scaricato'); else if (r === 'busy') toast('Conferma la richiesta di download già aperta.'); };
    const sh = $('#ex-share');
    if (sh) sh.onclick = async () => { try { await navigator.share({ files:[file], title: res.name }); } catch (e){ if (e && e.name !== 'AbortError') toast('Condivisione non riuscita: usa Scarica il video.'); } };
    $('#ex-close').onclick = () => { closeModal(); go(back); };
  } catch (e){
    console.error(e);
    $('#ex-modal').innerHTML = '<h3>Il video non è stato creato</h3><p>Questo browser non riesce a generare il video. Aggiorna il browser (Chrome o Safari) e riprova.</p><button class="btn btn-primary btn-block" id="ex-close">Chiudi</button>';
    $('#ex-close').onclick = () => { closeModal(); go(back); };
  }
}

go('home');
