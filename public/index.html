<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizon Render</title>
<meta name="description" content="Horizon Render: mostra al cliente la sua attività con l'insegna LED già montata e accesa.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Horizon Render">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@600&family=Playfair+Display:wght@700&family=Montserrat:wght@400;800&family=Anton&family=Fredoka:wght@700&family=Poppins:wght@700&family=Pacifico&family=Alfa+Slab+One&family=Orbitron:wght@700&family=Cinzel:wght@700&family=Cormorant+Garamond:wght@700&family=Bebas+Neue&family=Dancing+Script:wght@700&family=Oswald:wght@600&family=Abril+Fatface&family=Teko:wght@600&display=swap" rel="stylesheet">
<style>
/* Horizon Render — stesso stile di Horizon Spot. Stile minimale bianco e nero, pensato per chi ha dai 30 ai 60 anni:
   testi grandi, tasti alti, una cosa per schermata, il tasto principale sempre in basso. */
:root{
  --bg:#FFFFFF; --fg:#1D1D1F; --muted:#6E6E73; --fill:#F5F5F7; --fill-2:#EBEBF0; --line:#E5E5EA; --field:#D2D2D7;
  --primary:#1D1D1F; --on-primary:#FFFFFF; --primary-soft:#3A3A3C; --on-primary-muted:#D2D2D7;
  --warn-bg:#FFF4E5; --warn-fg:#8A4B00; --danger:#C4302B; --scrim:rgba(0,0,0,.42);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --fg:#F5F5F7; --muted:#A1A1A6; --fill:#1C1C1E; --fill-2:#2C2C2E; --line:#2C2C2E; --field:#3A3A3C;
  --primary:#F5F5F7; --on-primary:#000000; --primary-soft:#D2D2D7; --on-primary-muted:#3A3A3C;
  --warn-bg:#3A2A12; --warn-fg:#FFD08A; --danger:#FF6961; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#F5F5F7; --muted:#A1A1A6; --fill:#1C1C1E; --fill-2:#2C2C2E; --line:#2C2C2E; --field:#3A3A3C;
  --primary:#F5F5F7; --on-primary:#000000; --primary-soft:#D2D2D7; --on-primary-muted:#3A3A3C;
  --warn-bg:#3A2A12; --warn-fg:#FFD08A; --danger:#FF6961; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;}
[hidden]{display:none !important;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100%;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);}
img{max-width:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button,label[for]{cursor:pointer;}
a{color:var(--fg);}
:focus-visible{outline:3px solid var(--muted);outline-offset:2px;}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:22px;padding-block:12px 28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));}
.app > *{min-width:0;}

/* marchio: il simbolo Horizon dentro un quadrato nero */
.mark{width:32px;height:32px;border-radius:9px;background:#000;display:inline-grid;place-items:center;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;}
.mark img{width:72%;height:auto;display:block;}
.mark.lg{width:44px;height:44px;border-radius:12px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.2px;}

/* intestazione delle schermate */
.topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;min-height:44px;}
.tb-center{display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--muted);text-align:center;}
.icon-btn{width:44px;height:44px;border-radius:22px;border:0;background:var(--fill);display:grid;place-items:center;color:var(--fg);padding:0;}
.icon-btn svg{stroke:currentColor;}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:-10px;}
.bars span{height:4px;border-radius:2px;background:var(--line);}
.bars span.on{background:var(--primary);}
h1,.page-title{margin:0;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.7px;text-wrap:balance;}
.sub{margin:6px 0 0;color:var(--muted);font-size:17px;}
h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px;}
h3{margin:0;font-size:17px;font-weight:700;}
.hint{color:var(--muted);font-size:15px;margin:0;}
.hint.small{font-size:14px;}
.center{text-align:center;}
.stack{display:flex;flex-direction:column;gap:12px;}
.section-label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 -12px;}
.opt{font-weight:400;color:var(--muted);font-size:15px;}

/* bottoni */
.btn{appearance:none;border:0;cursor:pointer;padding:0 18px;border-radius:14px;font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;background:var(--fill);color:var(--fg);text-decoration:none;}
.btn svg{stroke:currentColor;}
.btn[disabled]{opacity:.35;cursor:not-allowed;}
.btn-primary{background:var(--primary);color:var(--on-primary);}
.btn-secondary{background:var(--fill);color:var(--fg);}
.btn-ghost{background:transparent;color:var(--fg);font-weight:500;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:12px;}
.btn-lg{min-height:56px;}
.btn-block{width:100%;}
.btn small{font-weight:500;opacity:.7;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn-row.center{justify-content:center;}
.btn-row.end{justify-content:flex-end;}
.link{border:0;background:transparent;font-weight:600;padding:10px 4px;color:var(--fg);}
.actionbar{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;margin:auto calc(-1*max(20px,env(safe-area-inset-left,0px))) -28px;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:linear-gradient(to bottom,transparent,var(--bg) 26%);}
.actionbar .btn{flex:1;min-height:54px;}
.actionbar.col{flex-direction:column;gap:4px;}

/* home */
.mode-card{display:flex;flex-direction:column;gap:14px;text-align:left;border:0;border-radius:var(--r-lg);padding:22px;width:100%;}
.mode-card.fast{background:var(--primary);color:var(--on-primary);}
.mode-card.adv{background:var(--bg);color:var(--fg);border:2px solid var(--fg);padding:20px;}
.mode-card .row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.mode-card .tt{font-size:22px;font-weight:700;letter-spacing:-.4px;}
.mode-card .dd{font-size:15px;line-height:1.4;}
.mode-card.fast .dd{color:var(--on-primary-muted);}
.mode-card.adv .dd{color:var(--muted);}
.mode-card .go{display:grid;place-items:center;height:50px;border-radius:14px;font-weight:600;}
.mode-card.fast .go{background:var(--on-primary);color:var(--primary);}
.mode-card.adv .go{background:var(--fill);}
.mode-tag{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:999px;padding:4px 10px;}
.pill-time{font-size:13px;font-weight:500;border-radius:999px;padding:6px 12px;}
.mode-card.fast .pill-time{background:var(--primary-soft);color:var(--on-primary);}
.mode-card.adv .pill-time{background:var(--fill);}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;font-weight:500;}
.or span{flex:1;height:1px;background:var(--line);}
.spot-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--fill);border-radius:18px;overflow:hidden;}
.spot-item{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;}
.spot-item+.spot-item{border-top:1px solid var(--line);}
.spot-thumb{width:52px;height:52px;border-radius:10px;overflow:hidden;background:#000;display:grid;place-items:center;color:#fff;}
.spot-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.spot-meta strong{display:block;font-size:16px;font-weight:600;overflow-wrap:anywhere;}
.spot-meta small{color:var(--muted);font-size:13px;}
.spot-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;}
.empty{background:var(--fill);border-radius:18px;padding:18px;color:var(--muted);font-size:15px;}

/* opzioni grandi (insegna, durata) */
.opt-list{display:flex;flex-direction:column;gap:10px;}
.opt-row{display:flex;align-items:center;gap:16px;border:2px solid transparent;background:var(--fill);border-radius:18px;padding:14px 18px;text-align:left;width:100%;color:var(--fg);}
.opt-row[aria-pressed="true"]{border-color:var(--fg);background:var(--bg);}
.opt-row .t{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;display:block;}
.opt-row .d{font-size:14px;color:var(--muted);display:block;font-variant-numeric:tabular-nums;}
.opt-row .grow{flex:1;min-width:0;}
.shape-box{width:64px;height:64px;display:grid;place-items:center;flex-shrink:0;}
.shape{background:var(--primary);border-radius:4px;}
.shape.dashed{background:transparent;border:2px dashed var(--muted);}
.check{width:24px;height:24px;border-radius:12px;border:2px solid var(--field);flex-shrink:0;display:grid;place-items:center;}
.check svg{stroke:var(--on-primary);opacity:0;}
.opt-row[aria-pressed="true"] .check{background:var(--primary);border-color:var(--primary);}
.opt-row[aria-pressed="true"] .check svg{opacity:1;}
.dur-big{font-size:28px;font-weight:700;min-width:64px;font-variant-numeric:tabular-nums;}

/* campi */
.field{display:flex;flex-direction:column;gap:6px;}
.lbl{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;margin:0;}
.lbl .opt{font-size:14px;}
.counter{margin-left:auto;font-weight:500;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
.help{font-size:14px;color:var(--muted);margin:-2px 0 2px;line-height:1.35;}
.help b{color:var(--fg);font-weight:600;}
.input{width:100%;min-height:54px;border:1px solid var(--field);border-radius:14px;padding:0 16px;font-size:17px;background:var(--bg);color:var(--fg);}
textarea.input{padding:12px 16px;min-height:84px;resize:vertical;line-height:1.35;display:block;}
.input:focus{border-color:var(--fg);outline:none;}
.input::placeholder{color:var(--muted);}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 24px,calc(100% - 16px) 24px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px;}
.money{position:relative;}
.money .input{padding-right:44px;font-variant-numeric:tabular-nums;}
.money .cur{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;}
.warn{display:block;background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.35;margin:0;}
.warn button{border:0;background:transparent;color:var(--warn-fg);font-weight:700;text-decoration:underline;padding:0;margin-top:4px;font-size:14px;display:block;}
.warn-text{color:var(--warn-fg);}
.info-btn{width:28px;height:28px;border-radius:14px;border:1.5px solid var(--muted);background:transparent;color:var(--fg);font:italic 700 15px Georgia,serif;display:inline-grid;place-items:center;padding:0;flex-shrink:0;}
.info-btn[aria-expanded="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}
.info{background:var(--fill);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.4;}
.info p{margin:0;}
.ideas{display:flex;flex-wrap:wrap;gap:8px;}
.ideas button{border:1px solid var(--field);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:14px;color:var(--fg);}
.range-row{display:flex;align-items:center;gap:12px;}
.range-row input{flex:1;accent-color:var(--fg);}
.range-row output{min-width:48px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--fill);border-radius:16px;padding:12px 16px;min-height:56px;}
.switch-row label{font-weight:500;font-size:16px;}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--field);position:relative;flex-shrink:0;cursor:pointer;margin:0;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s;}
.switch:checked{background:var(--primary);}
.switch:checked::after{left:22px;}
.check-row{display:flex;align-items:flex-start;gap:10px;font-size:15px;cursor:pointer;}
.check-row input{width:20px;height:20px;margin-top:1px;accent-color:var(--fg);flex:none;}

/* segmenti */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;background:var(--fill);border-radius:12px;padding:3px;}
.seg-btn{min-height:40px;border:0;border-radius:10px;background:transparent;font-size:15px;font-weight:500;color:var(--muted);padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15;text-align:center;}
.seg-btn small{font-weight:400;font-size:12px;color:var(--muted);}
.seg-btn.selected,.seg-btn[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.seg.wrap{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));}
.pills{display:flex;flex-wrap:wrap;gap:8px;}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--fill);font-size:15px;font-weight:500;color:var(--fg);}
.pill.selected{background:var(--primary);color:var(--on-primary);font-weight:600;}

/* contenuti (foto, video, tinta unita) */
.choice{display:flex;align-items:center;gap:16px;border:0;border-radius:18px;padding:16px 20px;min-height:74px;background:var(--fill);text-align:left;width:100%;color:var(--fg);}
.choice svg{stroke:currentColor;flex-shrink:0;}
.choice.primary{background:var(--primary);color:var(--on-primary);}
.choice .t{font-size:18px;font-weight:600;display:block;}
.choice .d{font-size:14px;color:var(--muted);display:block;}
.choice.primary .d{color:var(--on-primary-muted);}
.choice .grow{flex:1;min-width:0;}
.media-grid{display:flex;gap:10px;flex-wrap:wrap;}
.ph{position:relative;width:96px;height:96px;border-radius:14px;overflow:hidden;background:#000;flex-shrink:0;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;}
.ph .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:15px;border:0;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:0;}
.ph .x svg{stroke:#fff;}
.ph .kind{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;}
.ph .num{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;}
.add-tile{width:96px;height:96px;border-radius:14px;border:1.5px dashed var(--muted);background:transparent;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:8px;flex-shrink:0;}
.add-tile svg{stroke:var(--fg);}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--fill);border-radius:16px;padding:16px;font-size:15px;color:var(--muted);}
.tip svg{stroke:var(--fg);flex-shrink:0;}

/* insegna e anteprima */
.stage{border-radius:var(--r-lg);background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;}
.frame{margin:0 auto;background:#111;border-radius:12px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);line-height:0;max-width:100%;}
.screen{position:relative;border-radius:3px;overflow:hidden;background:#000;}
.screen canvas{display:block;width:100%;height:100%;}
.screen canvas.draggable{cursor:grab;touch-action:none;}
.frame-drop{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:#1C1C1E;color:#fff;cursor:pointer;padding:10px;text-align:center;line-height:1.3;}
.res{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;line-height:1.3;}
.sticky-prev{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding-block:6px 10px;margin-block:-6px -10px;border-bottom:1px solid var(--line);}
.sticky-prev .stage{padding:10px;gap:6px;}
.player-ctrl{display:flex;align-items:center;gap:12px;width:100%;}
.player-ctrl .icon-btn{width:40px;height:40px;background:var(--bg);}
.player-ctrl input[type=range]{flex:1;accent-color:var(--fg);}
.time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:74px;text-align:right;}
.led-toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer;color:var(--muted);}
.led-toggle input{width:18px;height:18px;accent-color:var(--fg);}

/* schede dell'editor */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;background:var(--fill);border-radius:12px;padding:3px;}
.tabs button{min-height:40px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:500;color:var(--muted);padding:0 6px;}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.group{display:flex;flex-direction:column;gap:18px;background:var(--fill);border-radius:20px;padding:18px;}
.group .input{background:var(--bg);}
.group .seg,.group .tabs{background:var(--bg);}
.group .seg-btn.selected,.group .seg-btn[aria-pressed="true"]{background:var(--fill);}
.group .switch-row,.group .choice-row{background:var(--bg);}
.group .pill{background:var(--bg);}
.group .btn-secondary{background:var(--bg);}
.group details.more .btn-secondary{background:var(--fill);}
.group .pill.selected{background:var(--primary);}
.group-title{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px;font-weight:700;}
.choice-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--fill);}
.choice-val{min-width:0;}
.choice-val strong{display:block;font-size:16px;font-weight:600;}
.choice-val small{display:block;color:var(--muted);font-size:13px;}
.logo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.logo-box{width:80px;height:80px;border-radius:14px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:10px;background:#000;}
.logo-box img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
.dropzone{width:100%;border:1.5px dashed var(--muted);border-radius:18px;padding:22px 14px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg);}
.dropzone small{color:var(--muted);font-size:14px;}
.swatch-row{display:flex;gap:18px;flex-wrap:wrap;}
.swatch-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.swatch{position:relative;width:48px;height:48px;border-radius:14px;border:1px solid var(--field);overflow:hidden;display:block;}
.swatch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:none;padding:0;}
.swatch-item small{font-size:13px;color:var(--muted);}

/* colori */
.swatches{display:flex;flex-wrap:wrap;gap:10px;}
.sw{width:44px;height:44px;border-radius:22px;border:1px solid var(--field);padding:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg);}
.sw.rainbow{background:conic-gradient(#FF3B30,#FFD60A,#30D158,#0A84FF,#BF5AF2,#FF3B30);}
.hsl{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:16px;padding:14px;}
.hsl-row{display:flex;align-items:center;gap:12px;}
.hsl-row .t{flex:1;font-size:15px;font-weight:600;}
.hsl-chip{width:36px;height:36px;border-radius:18px;border:1px solid var(--field);flex-shrink:0;}
.hsl-lbl{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:-4px;}
.hsl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;border-radius:16px;margin:0;touch-action:none;cursor:pointer;}
.hsl .hue{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);}
.hsl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:transparent;border:4px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.35);}
.hsl input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:transparent;border:4px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.35);}
.sol-shades{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;}
.sol-shades .sol-sw{width:100%;height:34px;border-radius:8px;border:1px solid var(--field);padding:0;}
.sol-sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg);}

/* elenco a discesa: stile delle scritte */
.dd{position:relative;}
.dd-btn{width:100%;display:grid;grid-template-columns:1fr auto;grid-template-areas:"sample chev" "name chev";align-items:center;column-gap:12px;row-gap:6px;padding:12px 14px;border-radius:14px;border:1px solid var(--field);background:var(--bg);color:var(--fg);cursor:pointer;text-align:left;}
.dd-btn .dd-stage{grid-area:sample;}
.dd-btn .dd-name{grid-area:name;}
.dd-btn .dd-chev{grid-area:chev;}
.dd-name{font-size:14px;color:var(--muted);font-weight:500;}
.dd-chev{width:9px;height:9px;border-right:2px solid var(--fg);border-bottom:2px solid var(--fg);transform:rotate(45deg);margin:0 4px 4px 0;display:block;}
.dd.open .dd-chev{transform:rotate(-135deg);margin:4px 4px 0 0;}
.dd-list{margin:8px 0 0;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--bg);max-height:360px;overflow:auto;display:grid;gap:2px;}
.dd-list[hidden]{display:none;}
.dd-opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;padding:8px 10px;border:none;border-radius:10px;background:transparent;color:var(--fg);cursor:pointer;text-align:left;}
.dd-opt:hover{background:var(--fill);}
.dd-opt[aria-selected="true"]{background:var(--fill-2);}
.dd-opt .dd-name{white-space:nowrap;}
.dd-stage{display:inline-block;justify-self:start;max-width:100%;padding:10px 14px;border-radius:9px;background:linear-gradient(120deg,#6a7a8c,#3e5a66 70%,#2e3f4c);overflow:hidden;}
.dd-sample{display:inline-block;font-size:1.2rem;line-height:1.15;white-space:nowrap;color:#fff;}

/* riepilogo e riordino */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
.tl-card{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 4px;background:var(--fill);border-radius:16px;}
.tl-card.dragging{position:relative;z-index:3;background:var(--bg);box-shadow:0 10px 26px rgba(0,0,0,.22);}
.tl-card.fixed,.tl-card.off{padding-left:12px;}
.tl-card.off{background:transparent;border:1.5px dashed var(--field);}
.handle{width:40px;height:52px;border:0;background:transparent;display:grid;place-items:center;touch-action:none;cursor:grab;flex-shrink:0;border-radius:10px;padding:0;color:var(--muted);}
.handle svg{stroke:currentColor;}
.tl-thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;background:#000;display:grid;place-items:center;cursor:pointer;border:none;padding:0;flex-shrink:0;}
.tl-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.tl-thumb.logo img{object-fit:contain;padding:6px;}
.tl-body{flex:1;min-width:0;}
.tl-body strong{display:block;font-size:16px;font-weight:600;overflow-wrap:anywhere;}
.tl-body small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere;}
.tl-warn{color:var(--warn-fg);background:var(--warn-bg);display:inline-block;border-radius:6px;padding:1px 6px;margin-top:4px;font-size:12px;}
.tl-actions{display:flex;gap:4px;flex-shrink:0;}
.tl-actions .btn{min-height:40px;padding:0 10px;font-size:15px;background:transparent;}
.tl-trans{display:flex;justify-content:center;padding:6px 0;position:relative;}
.tl-trans::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--line);}
.tl-trans button{position:relative;border:1px solid var(--field);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg);}
.tl.reordering .tl-trans{visibility:hidden;}
.summary{display:flex;flex-direction:column;background:var(--fill);border-radius:16px;}
.summary div{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;font-size:16px;}
.summary div+div{border-top:1px solid var(--line);}
.summary span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;}
.settings-list{display:flex;flex-direction:column;background:var(--fill);border-radius:16px;}
.settings-list > button{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:0 16px;border:0;background:transparent;font-size:16px;font-weight:500;width:100%;text-align:left;color:var(--fg);}
.settings-list > button+button{border-top:1px solid var(--line);}
.settings-list .v{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px;font-weight:400;font-variant-numeric:tabular-nums;text-align:right;}
.chev{stroke:var(--muted);flex-shrink:0;}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.setting > span{font-weight:600;font-size:16px;}
.setting .seg{min-width:230px;flex:1;max-width:320px;}

/* ricerca online */
.px-search{display:flex;gap:8px;margin-top:10px;}
.px-search .input{flex:1;}
.px-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;}
.px-tile{position:relative;border:none;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--fill);cursor:pointer;}
.px-tile img{width:100%;height:100%;object-fit:cover;display:block;}
.px-grid.busy{opacity:.4;pointer-events:none;}
.px-kind{margin-bottom:4px;}
.px-src{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.72);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;}
.px-dur{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:700;padding:2px 6px;border-radius:6px;}
.px-credit{font-size:13px;color:var(--muted);text-align:center;margin:14px 0 0;}
#px-status{margin-top:8px;}

/* transizioni */
.trans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.trans-item{border:2px solid transparent;background:var(--fill);border-radius:14px;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center;line-height:1.2;color:var(--fg);}
.trans-item canvas{width:100%;aspect-ratio:3/2;border-radius:8px;display:block;background:#000;}
.trans-item.selected{border-color:var(--fg);background:var(--bg);}
.trans-item .mix-ico{width:100%;aspect-ratio:3/2;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#1D1D1F;}
.trans-item .mix-ico svg{width:34%;height:auto;}

/* finestre e fogli */
.overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--bg);border-radius:22px;padding:22px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:calc(100% - 32px);overflow:auto;}
.modal h3{margin:0 0 8px;font-size:21px;font-weight:700;}
.modal p{margin:0 0 8px;color:var(--muted);font-size:16px;}
.modal-logo{display:none;}
.modal .mark{margin-bottom:14px;}
.modal .btn-row{margin-top:16px;}
.sheet-overlay{align-items:flex-end;padding:0;}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));width:100%;max-width:480px;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px;}
.sheet::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--field);margin:0 auto 4px;flex-shrink:0;}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.sheet-head h3{margin:0;font-size:24px;font-weight:700;letter-spacing:-.4px;}
.sheet-head .icon-btn{width:36px;height:36px;}
.sheet .hint{margin:0;}
.progress{height:6px;border-radius:999px;background:var(--fill-2);overflow:hidden;margin:14px 0 8px;}
.progress-fill{height:100%;width:0;background:var(--primary);}
.file-name{font-weight:600;word-break:break-all;margin:6px 0 2px;font-size:16px;color:var(--fg) !important;}
.howto{background:var(--fill);border-radius:14px;padding:12px 14px;margin:14px 0 6px;font-size:15px;}
.howto ol{margin:6px 0 0;padding-left:20px;}
.howto li{margin:2px 0;}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--primary);color:var(--on-primary);font-weight:600;padding:12px 18px;border-radius:14px;font-size:15px;max-width:calc(100% - 32px);z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.def-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin:6px 0;}
.def-row label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);font-weight:500;}
.def-row .input{text-align:center;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;}
.def-x{padding-bottom:15px;color:var(--muted);font-size:20px;}

/* ritaglio */
.ed-tools{display:flex;justify-content:center;}
.btn .ico{width:18px;height:18px;flex:none;}
.crop-stage{display:flex;justify-content:center;align-items:center;min-height:200px;}
.crop-stage canvas{display:block;border-radius:8px;touch-action:none;cursor:move;background:#000;}
.crop-stage canvas.static{cursor:default;}
.crop-actions{display:flex;gap:8px;align-items:center;}
.crop-spacer{flex:1;}

/* caselle di testo in più */
.bx-list{display:grid;gap:12px;}
.bx-card{padding:14px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;gap:10px;border:2px solid transparent;}
.bx-card.on{border-color:var(--fg);}
.bx-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.bx-head strong{font-size:15px;}
details.more{background:var(--bg);border-radius:16px;padding:0 14px;}
details.more > summary{list-style:none;cursor:pointer;min-height:52px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:16px;}
details.more > summary::-webkit-details-marker{display:none;}
details.more > summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;}
details.more[open] > summary::after{transform:rotate(-135deg);}
details.more > .stack{padding-bottom:14px;}
details.more .bx-card{background:var(--fill);}

/* render: foto dell'attività e posizione dell'insegna */
.place-wrap{display:flex;justify-content:center;margin:0;}
.place-canvas{display:block;border-radius:14px;touch-action:none;cursor:grab;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.18);}
.place-canvas.drawing{cursor:crosshair;}
.place-hint{min-height:2.6em;margin:-10px 4px 0;}
.choice-ico{color:var(--fg);flex-shrink:0;}
.choice-ico svg{width:44px;height:44px;display:block;}
.choice-row .choice-val{flex:1;}
.struct-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.struct-card{border:2px solid transparent;background:var(--fill);border-radius:16px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;color:var(--fg);}
.struct-card.selected{border-color:var(--fg);background:var(--bg);}
.struct-card svg{width:60px;height:60px;margin-bottom:4px;}
.struct-card strong{font-size:15px;font-weight:600;}
.struct-card span{font-size:13px;color:var(--muted);line-height:1.3;}
.pill-dot{display:inline-flex;align-items:center;gap:8px;}
.pill-dot i{width:16px;height:16px;border-radius:50%;border:1px solid var(--field);display:block;}
.render-stage{padding:10px;}
.render-frame{width:100%;border-radius:12px;overflow:hidden;background:#000;line-height:0;}
.render-frame canvas{display:block;width:100%;height:auto;}
.se-ratios{justify-content:center;}
.se-tools{display:flex;gap:8px;justify-content:center;}
.crop-sheet{gap:12px;}
@media (prefers-reduced-motion:no-preference){
  .btn,.seg-btn,.pill,.opt-row,.mode-card,.choice,.trans-item,.icon-btn,.px-tile,.tl-thumb{transition:transform 160ms var(--ease-out),background-color 150ms ease,border-color 150ms ease,color 150ms ease;}
  .btn:active,.seg-btn:active,.pill:active,.opt-row:active,.mode-card:active,.choice:active,.trans-item:active,.icon-btn:active,.px-tile:active,.tl-thumb:active{transform:scale(.98);}
  .app.view-in{animation:viewIn 220ms var(--ease-out);}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .overlay{animation:fadeIn 180ms ease;}
  .overlay .modal{animation:modalIn 200ms var(--ease-out);}
  .sheet-overlay .sheet{animation:sheetIn 300ms var(--ease-drawer);}
  @keyframes fadeIn{from{opacity:0;}}
  @keyframes modalIn{from{opacity:0;transform:scale(.96);}}
  @keyframes sheetIn{from{transform:translateY(100%);}}
  .toast{transition:opacity .2s ease,transform .2s ease;}
  .progress-fill{transition:width .15s linear;}
}
</style>

<body>
<main class="app" id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   CONFIGURAZIONE — modifica qui forme, stili e durate
   ===================================================================== */
// Forme per l'anteprima. La definizione video vera della insegna (in pixel)
// viene chiesta al cliente solo al momento di scaricare il video.
const SHAPES = [
  { id:'h', label:'Orizzontale', hint:'più larga che alta' },
  { id:'v', label:'Verticale',   hint:'più alta che larga' },
  { id:'q', label:'Quadrata',    hint:'larga quanto alta' }
];
const DEFAULT_DEFS = { h:{ w:192, h:128 }, v:{ w:128, h:192 }, q:{ w:160, h:160 } };
const DEF_MIN = 16, DEF_MAX = 2048;   // misure accettate per larghezza e altezza (pixel)
const TEXT_MAX_LINES = 10;       // righe massime della scritta
const TICKER_MAX = 140;         // caratteri massimi del testo a scorrimento
const LOGO_MIN_LED = 20;
const LETTER_MIN_LED = 8;       // sotto questa altezza (pixel LED) le lettere rischiano di non leggersi
const TSIZE_MIN = .6, TSIZE_MAX = 2.5;   // grandezza del testo scelta a mano (1 = normale)        // sotto questa altezza in pixel LED il logo rischia di non leggersi
const PROMO_MAX_LINES = 4;      // righe massime della promozione
const TEXT_MAX_HEIGHT = 0.66;   // altezza massima del blocco testo (quota del video)
const MARGIN = 0.06;            // margini laterali minimi
// Durate: numero di foto CONSIGLIATO (massimo consigliato). Non c'è un limite: decide chi crea lo spot.
const DURATIONS = {
  15: { rec:3 },
  30: { rec:6 },
  45: { rec:9 }
};
const MIN_SEC_PER_PHOTO = 2;   // sotto questa durata per foto mostriamo solo un avviso

// Apertura e chiusura con il logo: ci sono solo se il logo è stato caricato, e si possono togliere.
const hasIntro = p => !!p.logo && p.introOn !== false;
const hasOutro = p => !!p.logo && p.outroOn !== false;
const TR_BASE = 0.7; // durata di ogni transizione
let TR = TR_BASE;     // si accorcia da sola se le foto sono tante e brevi
const FPS = 25;
const PHOTO_MAX_SIDE = 1400;

// Ricerca online: passa dal server del sito (worker.js su Cloudflare), che aggiunge le chiavi API.

const SOURCES = { pixabay:'Pixabay', pexels:'Pexels', unsplash:'Unsplash' };
const PX_CACHE_MS = 24*60*60*1000;   // le librerie chiedono di tenere in memoria le ricerche per 24 ore
const IN_CLAUDE = !!window.claude || /claude\.ai|claudeusercontent|anthropic/.test(location.hostname);

// Stili delle scritte. "box" è il modo in cui la scritta è incorniciata:
// none = solo testo con ombra e filetto · rules = due filetti · band = fascia scura · solid = riquadro colorato
// pill = capsula colorata · lines = evidenziatore riga per riga · glow = bagliore neon · frame = cornice · wide = fascia a tutta larghezza
const DEFAULT_STYLE = 'minimale';
const FONT_STYLES = {
  minimale:    { label:'Minimale',    family:'Inter',            weight:600, box:'none' },
  elegante:    { label:'Elegante',    family:'Playfair Display', weight:700, box:'rules' },
  moderno:     { label:'Moderno',     family:'Montserrat',       weight:800, box:'band' },
  deciso:      { label:'Deciso',      family:'Anton',            weight:400, box:'solid', upper:true },
  giocoso:     { label:'Giocoso',     family:'Fredoka',          weight:700, box:'pill' },
  evidenziato: { label:'Evidenziato', family:'Poppins',          weight:700, box:'lines' },
  neon:        { label:'Neon',        family:'Pacifico',         weight:400, box:'glow' },
  retro:       { label:'Retrò',       family:'Alfa Slab One',    weight:400, box:'frame', upper:true, edge:'primary' },
  tecnico:     { label:'Tecnico',     family:'Orbitron',         weight:700, box:'frame', upper:true, edge:'white' },
  cinema:      { label:'Cinema',      family:'Cinzel',           weight:700, box:'wide',  upper:true },
  lusso:       { label:'Lusso',       family:'Cormorant Garamond', weight:700, box:'rules' },
  urbano:      { label:'Urbano',      family:'Bebas Neue',       weight:400, box:'band',  upper:true },
  firma:       { label:'Firma',       family:'Dancing Script',   weight:700, box:'none' },
  industriale: { label:'Industriale', family:'Oswald',           weight:600, box:'frame', upper:true, edge:'white' },
  vintage:     { label:'Vintage',     family:'Abril Fatface',    weight:400, box:'solid' },
  sportivo:    { label:'Sportivo',    family:'Teko',             weight:600, box:'lines', upper:true }
};
const TRANSITIONS = [
  { id:'fade',      label:'Dissolvenza' },
  { id:'fadeblack', label:'Dissolvenza a nero' },
  { id:'slideL',    label:'Scorri da sinistra' },
  { id:'slideR',    label:'Scorri da destra' },
  { id:'slideT',    label:"Scorri dall'alto" },
  { id:'slideB',    label:'Scorri dal basso' },
  { id:'wipeH',     label:'Tendina orizzontale' },
  { id:'wipeV',     label:'Tendina verticale' },
  { id:'zoomIn',    label:'Zoom avanti' },
  { id:'zoomOut',   label:'Zoom indietro' },
  { id:'iris',      label:'Cerchio' },
  { id:'bubbles',   label:'Bolle' },
  { id:'rotate',    label:'Rotazione' },
  { id:'blur',      label:'Sfocatura' },
  { id:'pixel',     label:'Pixel' },
  { id:'blinds',    label:'Veneziane' },
  { id:'diagonal',  label:'Diagonale' },
  { id:'flash',     label:'Flash bianco' }
];
const KB_MODES = [
  { id:'auto', label:'Automatico' },
  { id:'zoom', label:'Zoom' },
  { id:'pan', label:'Movimento' },
  { id:'zoompan', label:'Zoom + movimento' },
  { id:'still', label:'Ferma' }
];
const PROMO_POSITIONS = [
  { id:'with', label:'Con la scritta' },
  { id:'top', label:'In alto' },
  { id:'center', label:'Al centro' },
  { id:'bottom', label:'In basso' },
  { id:'manual', label:'Manuale' }
];
const POSITIONS = [
  { id:'top', label:'In alto' },
  { id:'center', label:'Al centro' },
  { id:'bottom', label:'In basso' },

const DB = {
  db: null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('horizon-render', 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath:'id' });
          if (!db.objectStoreNames.contains('media')) db.createObjectStore('media', { keyPath:'id' });
        };
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      } catch (e){ rej(e); }
    });
  },
  async run(mode, fn, store){
    store = store || 'projects';
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode); const req = fn(tx.objectStore(store)); let out;
      if (req) req.onsuccess = () => { out = req.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  all(){ return this.run('readonly', st => st.getAll()); },
  put(p){ return this.run('readwrite', st => st.put(p)); },
  del(id){ return this.run('readwrite', st => st.delete(id)); }
};

const BRAND_MARK = 'brand/mark-horizon.png';
async function ensureBrandFont(){
  if (!document.fonts || !document.fonts.load) return;
  try { await Promise.race([Promise.all([document.fonts.load('800 32px "Montserrat"', 'HORIZON'), document.fonts.load('400 32px "Montserrat"', 'RENDER')]), new Promise(r => setTimeout(r, 2500))]); } catch (e){}
}

  const S = Math.min(W, H), mark = imgReady.get(BRAND_MARK);

function askNumber(title, text, label, placeholder){
  return new Promise(res => {
    modalRoot.innerHTML = '<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' +
      '<div class="field"><label class="lbl" for="num-in">' + esc(label) + '</label><input class="input" id="num-in" inputmode="decimal" autocomplete="off" placeholder="' + esc(placeholder) + '"></div>' +
      '<p class="warn" id="num-err" hidden style="margin-top:8px">Scrivi un numero, per esempio 90.</p>' +
      '<div class="btn-row end"><button class="btn btn-secondary" data-a="no">Annulla</button><button class="btn btn-primary" data-a="ok">Applica</button></div></div></div>';
    const inp = $('#num-in');
    const ok = () => { const v = parseFloat(String(inp.value).replace(',', '.')); if (!(v > 0)){ $('#num-err').hidden = false; inp.focus(); return; } closeModal(); res(v); };

const PRICE_RE = /(?:€\s*\d+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?\s*(?:€|euro\b|eur\b)|\b\d+[.,]\d{2}\b)/i;
function cleanPrice(v){ v = String(v).replace(/\./g, ',').replace(/[^\d,]/g, ''); const i = v.indexOf(','); if (i >= 0) v = v.slice(0, i+1) + v.slice(i+1).replace(/,/g, '').slice(0, 2); return v; }
function splitPrice(text){
  const m = text.match(PRICE_RE); if (!m) return null;
  const num = (m[0].match(/\d+(?:[.,]\d{1,2})?/) || [''])[0].replace('.', ',');
  const rest = text.replace(m[0], '').replace(/\s{2,}/g, ' ').replace(/\s+([,.!])/g, '$1').replace(/\b(?:a soli|a|solo|prezzo)\s*$/i, '').trim();

function bindHsl(id, startHex, onChange){

async function setSlidePhoto(s, blob, credit){

async function setSlideVideo(s, blob, credit){

  const v = await importVideo(blob);
  s.videoId = await putMedia(blob); s.photo = v.poster; s.solid = null; s.clipStart = 0; s.cx = .5; s.cy = .5; s.crop = null; s.fit = 'cover'; s.credit = credit || null;

// Nuova foto in coda: nel manuale riprende posizione e impostazioni della foto precedente.
function newSlideAfter(p){
  const last = p.slides[p.slides.length - 1], ns = newSlide(last && last.transIn);
  if (last && !isGuided(p)){ ns.pos = last.pos; ns.tx = last.tx; ns.ty = last.ty; ns.tsize = last.tsize || 1; ns.mo = last.mo || ''; ns.tcolor = last.tcolor || ''; if (last.lg) ns.lg = Object.assign({}, last.lg); }
  return ns;
}
async function addFiles(files, onDone){
  const p = project; let added = 0;
  for (const f of files){
    if (isGuided(p) && p.slides.length >= GUIDED_MAX){ toast('Nello spot guidato puoi usare fino a ' + GUIDED_MAX + ' foto o video.'); break; }
    const s = newSlideAfter(p);
    try {
      if (isVideoFile(f)){ toast('Preparo il video…'); await setSlideVideo(s, f, null); } else await setSlidePhoto(s, f, null);
      p.slides.push(s); added++;
    } catch (e){ toast(e.code === 'big' ? 'Il video è troppo pesante (massimo ' + VIDEO_MAX_MB + ' MB): scegline uno più corto.' : isVideoFile(f) ? 'Non riesco a usare questo video. Prova con un altro.' : 'Non riesco a leggere questa foto. Prova con un JPG o PNG.'); }
  }
  if (added){ if (isGuided(p)) applyGuided(p); touch(); await saveNow(); }
  if (onDone) onDone(added);
}
async function addFromOnline(blob, hit, kind, onDone){
  const p = project, s = newSlideAfter(p), credit = { user: hit.user, page: hit.page, src: hit.src };
  try { if (kind === 'video') await setSlideVideo(s, blob, credit); else await setSlidePhoto(s, blob, credit); p.slides.push(s); if (isGuided(p)) applyGuided(p); touch(); await saveNow(); }
  catch (e){ toast('Non riesco a usare questo contenuto. Provane un altro.'); }
  if (onDone) onDone();
}

/* ---------- player dell'anteprima ---------- */
let player = null;
function stopPlayer(){ if (player){ player.stopped = true; cancelAnimationFrame(player.raf); player = null; } pauseAllVideos(); }
// cv = canvas; opts.ctrl = { play, seek, time } (facoltativi); opts.led = pixel dell'insegna
function mountPlayer(cv, p, opts){
  opts = opts || {};
  const sign = signOf(p), d = previewDims(sign); cv.width = d.W; cv.height = d.H;
  const W = d.W, H = d.H, ctx = cv.getContext('2d');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pl = { t: clamp(opts.seek || 0, 0, p.duration), playing: !reduce || !!opts.forcePlay, last: performance.now(), dirty: true, raf: 0, stopped: false, led: !!opts.led, segs: timeline(p) };
  const XS = exportScale(sign), hiC = makeCanvas(sign.w*XS, sign.h*XS), natC = makeCanvas(sign.w, sign.h);
  pl.refresh = () => { pl.segs = timeline(p); pl.dirty = true; };
  const draw = () => {
    if (pl.led){
      renderAt(hiC.getContext('2d'), hiC.width, hiC.height, pl.t, p, pl.segs);
      const n2 = natC.getContext('2d'); n2.imageSmoothingEnabled = true; n2.imageSmoothingQuality = 'high'; n2.drawImage(hiC, 0, 0, sign.w, sign.h);
      ctx.imageSmoothingEnabled = false; ctx.drawImage(natC, 0, 0, W, H); ctx.imageSmoothingEnabled = true;
    } else renderAt(ctx, W, H, pl.t, p, pl.segs);
  };
  const c = opts.ctrl || {};
  const setIcon = () => { if (c.play){ c.play.innerHTML = pl.playing ? IC.pause : IC.play; c.play.setAttribute('aria-label', pl.playing ? 'Pausa' : 'Riproduci'); } };
  const loop = now => {
    if (pl.stopped) return;
    if (!document.body.contains(cv)){ pl.stopped = true; pauseAllVideos(); return; }
    const dt = Math.min(.1, (now - pl.last)/1000); pl.last = now;
    if (pl.playing){ pl.t += dt; if (pl.t >= p.duration) pl.t = 0; pl.dirty = true; }
    const vs = videoStates(p, pl.segs, pl.t);
    if (vs.length){ syncVideos(p, pl.segs, pl.t, pl.playing); if (!pl.playing && vs.some(v => v.active && v.el.seeking)) pl.dirty = true; }
    if (pl.dirty){ draw(); if (c.seek){ c.seek.max = p.duration; c.seek.value = pl.t.toFixed(2); } if (c.time) c.time.textContent = fmtTime(pl.t) + ' / ' + fmtTime(p.duration); pl.dirty = false; }
    pl.raf = requestAnimationFrame(loop);
  };
  stopPlayer(); player = pl; setIcon(); pl.raf = requestAnimationFrame(loop);
  if (c.play) c.play.onclick = () => { pl.playing = !pl.playing; pl.last = performance.now(); setIcon(); };
  if (c.seek) c.seek.oninput = () => { pl.t = +c.seek.value; pl.dirty = true; };
  return pl;
}

// Scrive offerta, prodotto e prezzo su tutte le foto. placeholder = testo d'esempio finché il cliente non scrive.
function applyGuided(p, placeholder){
  const g = p.g, prod = (g.product || '').trim(), offer = (g.offer || '').trim(), price = (g.price || '').trim();
  const empty = !prod && !offer;
  p.motion = g.move === 'zoom' ? 'zoom' : 'slide';
  p.slides.forEach(s => {
    s.mo = ''; s.promoPos = 'with'; s.pos = s.solid ? 'center' : 'bottom'; s.boxes = [];
    s.tcolor = s.solid ? textOn(s.solid.c) : '';
    if (g.move === 'ticker'){
      s.kicker = ''; s.text = ''; s.promo = ''; s.price = '';
      s.ticker = [prod, offer || (empty && placeholder ? 'La tua proposta' : ''), priceText(price)].filter(Boolean).join('  •  '); s.tky = .9; s.tkDir = 'left'; s.tksize = 1;
    } else {
      s.ticker = ''; s.kicker = prod; s.text = offer || (empty && placeholder ? 'La tua proposta' : ''); s.price = price; s.promo = priceText(price);
    }
  });
}

/* =====================================================================
   ELENCO A DISCESA — stile delle scritte (senza riquadri pieni)
   ===================================================================== */
function sampleCss(fs, p){
  const prim = p.colors.primary, sh = 'text-shadow:0 1px 6px rgba(0,0,0,.75)';
  switch (fs.box){
    case 'rules': return 'border-top:1.5px solid ' + prim + ';border-bottom:1.5px solid ' + prim + ';padding:4px 12px;' + sh;
    case 'band':  return 'border-bottom:2.5px solid ' + prim + ';padding:0 6px 3px;' + sh;
    case 'solid': return 'color:' + (contrast(prim, '#000000') >= 3 ? prim : '#fff') + ';' + sh;
    case 'pill':  return '-webkit-text-stroke:1px ' + prim + ';' + sh;
    case 'lines': return 'text-decoration:underline;text-decoration-color:' + prim + ';text-decoration-thickness:3px;text-underline-offset:4px;' + sh;
    case 'glow':  return 'text-shadow:0 0 5px ' + prim + ',0 0 12px ' + prim + ',0 0 24px ' + prim;
    case 'frame': return 'border:2px solid ' + (fs.edge === 'white' ? 'rgba(255,255,255,.9)' : prim) + ';padding:3px 12px;border-radius:5px;' + sh;
    case 'wide':  return 'border-top:1.5px solid ' + prim + ';border-bottom:1.5px solid ' + prim + ';padding:4px 18px;' + sh;
    default:      return sh;
  }
}
function sampleHTML(key, p){
  const f = FONT_STYLES[key];
  return '<span class="dd-stage"><span class="dd-sample" style="font-family:\'' + f.family + '\',sans-serif;font-weight:' + f.weight + ';' + sampleCss(f, p) + '">' + (f.upper ? 'IL TUO SPOT' : 'Il tuo spot') + '</span></span>';
}
function styleDDHTML(p, open){
  const cur = FONT_STYLES[p.fontStyle] ? p.fontStyle : DEFAULT_STYLE;
  return '<div class="dd' + (open ? ' open' : '') + '"><button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="' + (open ? 'true' : 'false') + '">' + sampleHTML(cur, p) +
    '<span class="dd-name">' + esc(FONT_STYLES[cur].label) + (cur === DEFAULT_STYLE ? ' (consigliato)' : '') + '</span><i class="dd-chev" aria-hidden="true"></i></button>' +
    '<div class="dd-list" role="listbox" aria-label="Stile delle scritte"' + (open ? '' : ' hidden') + '>' +
    Object.keys(FONT_STYLES).map(k => '<button type="button" class="dd-opt" role="option" data-k="' + k + '" aria-selected="' + (k === cur) + '">' + sampleHTML(k, p) + '<span class="dd-name">' + esc(FONT_STYLES[k].label) + '</span></button>').join('') + '</div></div>';
}
function mountStyleDD(root, p, onChange){
  const render = open => {
    root.innerHTML = styleDDHTML(p, open);
    const dd = $('.dd', root), btn = $('.dd-btn', root), list = $('.dd-list', root);
    btn.onclick = () => render(list.hidden);
    $$('.dd-opt', root).forEach(o => o.onclick = async () => { p.fontStyle = o.dataset.k; touch(); await ensureFonts(p); render(false); if (onChange) onChange(); });
    dd.onkeydown = e => { if (e.key === 'Escape' && !list.hidden){ e.stopPropagation(); render(false); btn.focus(); } };
  };
  render(false);
}

/* =====================================================================
   MANUALE: riepilogo, con l'ordine che si cambia trascinando

VIEWS.review = async function(){
  const p = project, sign = signOf(p), rule = DURATIONS[p.duration] || DURATIONS[15];
  if (!p.duration) p.duration = 15;
  p.slides = p.slides.filter(s => s.photo); normalizeMix(p);
  const n = p.slides.length;
  await loadAssets(p); await ensureFonts(p);
  const segs = timeline(p), sec = secPerPhoto(p, n);
  const thumbImg = src => src ? '<img src="' + src + '" alt="">' : '';
  let tl = '';
  if (hasIntro(p)) tl += '<li class="tl-card fixed"><button class="tl-thumb logo" style="background:' + p.logoBg + '" data-seek="0" aria-label="Vai all\'apertura">' + thumbImg(p.logo) + '</button><div class="tl-body"><strong>Apertura</strong><small>Logo · ' + String(INTRO).replace('.', ',') + ' s</small></div><div class="tl-actions"><button class="btn" data-off="intro">Togli</button></div></li>';

  segs.filter(x => x.type === 'slide').forEach(seg => {
    const s = seg.slide, i = seg.i, small = measureShrink(s, p) < .7;
    const label = (s.text || s.kicker || '').trim();
    tl += (i > 0 || hasIntro(p) ? '<li class="tl-trans"><button data-tr="' + i + '">Transizione: ' + esc(trLabel(s.tFixed, s.transIn)) + '</button></li>' : '') +
      '<li class="tl-card" data-i="' + i + '"><button class="handle" data-handle="' + i + '" aria-label="Sposta ' + (i + 1) + ': trascina, oppure usa le frecce su e giù">' + IC.handle + '</button>' +
      '<button class="tl-thumb" data-seek="' + (seg.start + .6).toFixed(2) + '" aria-label="Vai a ' + (i + 1) + '">' + thumbImg(s.photo) + '</button>' +
      '<div class="tl-body"><strong>' + (i + 1) + '. ' + (label ? esc(label) : 'Senza scritta') + '</strong><small>' + (s.videoId ? 'Video' : s.solid ? 'Tinta unita' : 'Foto') + (s.promo ? ' · ' + esc(s.promo) : '') + '</small>' + (small ? '<span class="tl-warn">Testo lungo: risulterà piccolo</span>' : '') + '</div>' +
      '<div class="tl-actions"><button class="btn" data-edit="' + i + '">Modifica</button>' + (n > 1 ? '<button class="btn" data-del="' + i + '" aria-label="Togli ' + (i + 1) + '">' + IC.x + '</button>' : '') + '</div></li>';
  });
  if (hasOutro(p)){
    const outro = segs[segs.length - 1];
    tl += '<li class="tl-trans"><button data-tr="outro">Transizione: ' + esc(trLabel(p.outroFixed, p.outroTrans)) + '</button></li>' +
      '<li class="tl-card fixed"><button class="tl-thumb logo" style="background:' + p.logoBg + '" data-seek="' + (outro.start + .5).toFixed(2) + '" aria-label="Vai alla chiusura">' + thumbImg(p.logo) + '</button><div class="tl-body"><strong>Chiusura</strong><small>Logo · ' + String(OUTRO).replace('.', ',') + ' s</small></div><div class="tl-actions"><button class="btn" data-off="outro">Togli</button></div></li>';
  } else if (p.logo) tl += '<li class="tl-card off"><div class="tl-body"><strong>Chiusura tolta</strong><small>Lo spot finisce con la foto.</small></div><div class="tl-actions"><button class="btn" data-on="outro">Rimetti</button></div></li>';

  app.innerHTML = topbar('Passo 6 di 8', [8, 6]) + heading('Riepilogo dello spot.') +
    '<div class="stage">' + screenHTML(sign, '<canvas id="pl-canvas"></canvas>', 44) + playerCtrlHTML(p) +
      '<label class="led-toggle"><input type="checkbox" id="pl-led"' + (params.led ? ' checked' : '') + '> Mostra i pixel dell\'insegna</label></div>' +
    '<p class="section-label">Impostazioni</p>' +
    '<div class="settings-list"><button type="button" id="ch-sign"><span>Insegna</span><span class="v">' + esc(signName(p)) + IC.chev + '</span></button>' +
      '<button type="button" id="ch-brand"><span>Brand e logo</span><span class="v">' + esc(p.bizName || (p.logo ? 'Logo caricato' : 'Modifica')) + IC.chev + '</span></button></div>' +
    '<div class="setting"><span>Durata</span><div class="seg" id="dur">' + [15, 30, 45].map(d => '<button type="button" class="seg-btn' + (p.duration === d ? ' selected' : '') + '" data-v="' + d + '">' + d + ' s</button>').join('') + '</div></div>' +
    (sec < MIN_SEC_PER_PHOTO ? '<p class="warn">Con ' + n + ' contenuti ognuno resta a schermo circa ' + fmtSec(sec) + ' secondi: chi passa potrebbe non fare in tempo a leggerlo.</p>' : '<p class="hint small">' + n + (n === 1 ? ' contenuto' : ' contenuti, ognuno') + ' a schermo circa ' + fmtSec(sec) + ' secondi. Per ' + p.duration + ' secondi ne consigliamo fino a ' + rule.rec + '.</p>') +
    '<p class="section-label">Foto e video</p><p class="hint small" style="margin-bottom:-10px">Per cambiare l\'ordine tieni premute le tre righe a sinistra e trascina.</p>' +
    '<ol class="tl" id="tl">' + tl + '</ol>' +
    '<div class="btn-row"><button class="btn btn-secondary btn-sm" id="add">' + IC.plus + 'Aggiungi</button><button class="btn btn-secondary btn-sm" id="remix">Rimescola le transizioni</button></div>' +
    '<div class="btn-row"><button class="btn btn-secondary btn-sm" id="export"' + (n ? '' : ' disabled') + '>' + IC.download + 'Scarica solo lo spot</button><button class="btn btn-ghost btn-sm" id="save">Salva e chiudi</button></div>' +
    '<div class="actionbar"><button class="btn btn-primary" id="to-site"' + (n ? '' : ' disabled') + '>Avanti: monta sull\'attività</button></div>';

  const pl = mountPlayer($('#pl-canvas'), p, { ctrl: playerCtrl(), seek: params.seek, led: params.led });

  $$('[data-seek]').forEach(b => b.onclick = () => { pl.t = +b.dataset.seek; pl.dirty = true; window.scrollTo({ top:0, behavior: reduce ? 'auto' : 'smooth' }); });
  $$('#dur .seg-btn').forEach(b => b.onclick = () => { const d = +b.dataset.v; if (d === p.duration) return; p.duration = d; touch(); go('review'); });

  const list = $('#tl');
  const applyOrder = order => { if (order.every((v, k) => v === k)) return false; p.slides = order.map(k => p.slides[k]); if (!p.outroFixed) normalizeMix(p); touch(); return true; };
  $$('[data-handle]').forEach(h => {
    const row = h.closest('.tl-card'); let on = false;
    h.addEventListener('pointerdown', e => { e.preventDefault(); on = true; try { h.setPointerCapture(e.pointerId); } catch (_){} row.classList.add('dragging'); list.classList.add('reordering'); });
    h.addEventListener('pointermove', e => {
      if (!on) return; const y = e.clientY;

      (needGround ? '<p class="help" style="margin:0">Trascina il rombo bianco fino al punto in cui la struttura tocca terra.</p>' : needTop ? '<p class="help" style="margin:0">Trascina il rombo bianco fino al soffitto o al punto in cui si agganciano i cavi.</p>' : '') + '</div>' +
    '<div class="group"><div class="group-title">Foto dell\'attività</div><p class="help" style="margin:0">Se la tagli, la ruoti o la cambi dovrai riposizionare l\'insegna.</p><div class="btn-row"><button class="btn btn-secondary btn-sm" id="se-open">' + CROP_SVG + 'Taglia e sistema</button></div>' + siteUploadHTML('re', true) + '</div>' +
    '<div class="actionbar"><button class="btn btn-primary" id="next"' + (site.q ? '' : ' disabled') + '>Avanti: guarda il render</button></div>';
  bindTopbar(async () => { await saveNow(); go(spotView()); });
  bindSiteUpload('re');
  $('#se-open').onclick = () => openSiteEdit(() => go('place'));

  // dimensioni del disegno
  const wrap = $('#pwrap'), cv = $('#pc'), ctx = cv.getContext('2d');
  const iw = img.naturalWidth, ih = img.naturalHeight;
  let cssW = wrap.clientWidth, cssH = cssW*ih/iw; const maxH = Math.max(260, window.innerHeight*.62);
  if (cssH > maxH){ cssH = maxH; cssW = cssH*iw/ih; }
  placeWidth = wrap.clientWidth;
  const dpr = Math.min(2, window.devicePixelRatio || 1), k0 = Math.min(1, 1600 / Math.max(cssW*dpr, cssH*dpr));
  const W = even(cssW*dpr*k0), H = even(cssH*dpr*k0), S = W / cssW;
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px'; cv.width = W; cv.height = H;
  const R = makeRender(p, W, H, img, 2);
  // struttura appena scelta: la base parte dentro la foto, così il rombo si può trascinare

    const g = R.geo;

    if (needTop){ const pt = g.S(g.c.w/2, g.T); if (pt[1] < H*.04) site.top = Math.round(clamp(-g.f - g.yAlong([pt[0], H*.05], 0), 5, 400)); }
    touch(); rebuildBase(R);
  }
  const seg0 = R.segs[0], tStill = seg0 ? clamp(2.2, 0, Math.max(0, seg0.dur - TR/2 - .05)) : 0;
  let spotReady = false, measuring = false, redrawing = !site.q, drag = null, raf = 0;
  const hint = () => {
    let t;
    if (measuring) t = 'Traccia una linea su qualcosa di cui conosci la misura, alla stessa distanza dell\'insegna.';
    else if (redrawing || !site.q) t = 'Trascina il dito sulla foto dove va l\'insegna, da un angolo a quello opposto.';
    else if (site.persp) t = 'Porta ogni angolo sul punto giusto della foto per seguire la prospettiva.';
    else t = 'Trascina l\'insegna per spostarla, un angolo per ingrandirla o rimpicciolirla.';
    $('#phint').textContent = t;
    cv.classList.toggle('drawing', measuring || redrawing || !site.q);
  };
  const handles = () => {
    const out = []; if (!site.q || !R.geo) return out;
    quadPx(site.q, W, H).forEach((pt, i) => out.push({ kind:'corner', i, pt }));
    const g = R.geo;
    if (needGround) out.push({ kind:'ground', pt: g.S(g.c.w/2, g.G) });

  const diamond = (pt, r) => { ctx.beginPath(); ctx.moveTo(pt[0], pt[1] - r); ctx.lineTo(pt[0] + r, pt[1]); ctx.lineTo(pt[0], pt[1] + r); ctx.lineTo(pt[0] - r, pt[1]); ctx.closePath(); };
  const draw = () => {

          else {

            diamond(h.pt, 11*S); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3*S; ctx.strokeStyle = '#000'; ctx.stroke();

  const toPx = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left)*W/r.width, (e.clientY - r.top)*H/r.height]; };
  const toNorm = q => q.map(pt => [pt[0]/W, pt[1]/H]);
  const ratio = c.w / c.h;
  const rectQ = (x0, y0, w) => { const h = w/ratio; return [[x0, y0], [x0 + w, y0], [x0 + w, y0 + h], [x0, y0 + h]]; };
  const centroid = q => [(q[0][0] + q[1][0] + q[2][0] + q[3][0])/4, (q[0][1] + q[1][1] + q[2][1] + q[3][1])/4];
  const widthOf = q => (dist(q[0], q[1]) + dist(q[3], q[2]))/2;
  const scaleAbout = (q, o, k) => q.map(pt => [o[0] + (pt[0] - o[0])*k, o[1] + (pt[1] - o[1])*k]);
  const placed = () => { redrawing = false; hint(); $('#next').disabled = false; touch(); if (!site.structure) openStructureSheet(() => go('place')); };

  cv.addEventListener('pointerdown', e => {
    const pt = toPx(e); try { cv.setPointerCapture(e.pointerId); } catch (_){}
    if (measuring){ drag = { kind:'measure', a:pt, b:pt }; return; }
    if (redrawing || !site.q){ drag = { kind:'draw', a:pt }; return; }
    const hs = handles(); let best = null, bd = 26*S;

  $('#next').onclick = async () => { if (!site.q) return; if (!site.structure) site.structure = 'none'; await saveNow(); go('render'); };
}

/* ---------- Ritaglia: riquadro con la forma dell'insegna ---------- */
const CROP_SVG = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>';
function openCrop(s, sign, onDone){
  const img = imgReady.get(s.photo); if (!img) return;
  const iw = img.naturalWidth, ih = img.naturalHeight, ratio = sign.w / sign.h;
  const maxW = Math.min(iw, ih*ratio), minW = Math.max(maxW*.12, 24);
  const fitRect = (cx, cy, w) => { w = clamp(w, minW, maxW); const h = w/ratio; return { x: clamp(cx - w/2, 0, iw - w), y: clamp(cy - h/2, 0, ih - h), w, h }; };
  const fullRect = () => fitRect(iw/2, ih/2, maxW);
  let R;
  if (s.crop){ const c = s.crop, area = c.w*iw * c.h*ih; R = fitRect((c.x + c.w/2)*iw, (c.y + c.h/2)*ih, Math.sqrt(area*ratio)); }   // se nel frattempo è cambiata la forma, tiene centro e grandezza
  else R = fitRect(s.cx*iw, s.cy*ih, maxW);
  let mode = s.fit === 'full' ? 'full' : 'crop';
  modalRoot.innerHTML = '<div class="overlay sheet-overlay" id="crop-ov"><div class="sheet crop-sheet" role="dialog" aria-modal="true" aria-label="Ritaglia"><div class="sheet-head"><h3>Ritaglia</h3><button class="icon-btn" id="crop-x" aria-label="Chiudi">✕</button></div>' +
    '<div class="seg seg-2" id="crop-mode"><button type="button" class="seg-btn" data-v="crop">Ritaglia<small>riempie tutta l\'insegna</small></button><button type="button" class="seg-btn" data-v="full">Foto intera<small>senza tagli, sfondo sfocato</small></button></div>' +
    '<div class="crop-stage" id="crop-stage"><canvas id="crop-cv"></canvas></div>' +
    '<p class="hint small center" id="crop-hint"></p>' +
    '<div class="crop-actions"><button type="button" class="btn btn-ghost btn-sm" id="crop-reset">Ripristina</button><span class="crop-spacer"></span><button type="button" class="btn btn-secondary" id="crop-cancel">Annulla</button><button type="button" class="btn btn-primary" id="crop-ok">Applica</button></div></div></div>';
  const stage = $('#crop-stage'), cv = $('#crop-cv'), ctx = cv.getContext('2d'), hint = $('#crop-hint');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  let k = 1, cssW = 0, cssH = 0, PW = 0, PH = 0;
  const layout = () => {
    const availW = stage.clientWidth, availH = Math.max(200, Math.min(window.innerHeight*.56, 560));
    if (mode === 'crop'){ k = Math.min(availW/iw, availH/ih); cssW = iw*k; cssH = ih*k; }
    else { const kk = Math.min(availW/ratio, availH); cssW = kk*ratio; cssH = kk; }
    cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px'; PW = Math.round(cssW*dpr); PH = Math.round(cssH*dpr); cv.width = PW; cv.height = PH;
  };
  const draw = () => {
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, PW, PH);
    if (mode === 'full'){ drawPhotoFull(ctx, PW, PH, img, 1); hint.textContent = 'La foto entra tutta nell\'insegna; lo spazio vuoto si riempie con la foto stessa, sfocata.'; return; }

function baseName(p){ return (p.bizName || (p.g && (p.g.product || p.g.offer)) || 'RENDER').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'RENDER'; }

// Il render: foto dell'attività con l'insegna accesa, in HD o Full HD.
async function exportRender(p, onProg){
  await loadAssets(p); await ensureFonts(p); await ensureBrandFont();
  const img = await loadImg(p.site.photo), q = QUALITIES.find(x => x.id === p.quality) || QUALITIES[1];
  const { W, H } = siteDims(img, q.long);
  const R = makeRender(p, W, H, img), out = makeCanvas(W, H), octx = out.getContext('2d');
  const segs = R.segs, total = Math.round(p.duration * FPS);
  const drawFrame = t => compositeFrame(octx, R, t);

  const beforeFrame = hasVid ? (t => seekVideosFor(p, segs, t)) : null;
  const liveSync = hasVid ? (t => syncVideos(p, segs, t, true)) : null;
  const bitrate = Math.round(clamp(W*H*FPS*.12, 3e6, 14e6));
  pauseAllVideos();
  let res = null;
  if (window.VideoEncoder && window.VideoFrame && window.Mp4Muxer){
    try { res = await exportWebCodecs(out, drawFrame, W, H, total, onProg, beforeFrame, bitrate, ['avc1.640033', 'avc1.4d0033', 'avc1.640032', 'avc1.640028', 'avc1.42E033', 'avc1.42001f']); } catch (e){ console.warn('WebCodecs non riuscito, uso MediaRecorder', e); }
  }
  if (!res){ try { res = await exportRecorder(out, drawFrame, p.duration, onProg, liveSync, Math.min(bitrate, 12e6)); } finally { pauseAllVideos(); } }
  return Object.assign(res, { W, H, name: baseName(p) + '_RENDER_' + W + 'X' + H + '.' + res.ext });
}
async function exportVideo(p, onProg){
  await loadAssets(p); await ensureFonts(p);
  const sign = signOf(p), W = sign.w, H = sign.h, S = exportScale(sign);
  const hi = makeCanvas(W*S, H*S), hctx = hi.getContext('2d');
  const out = makeCanvas(W, H), octx = out.getContext('2d');
  const segs = timeline(p); const total = Math.round(p.duration * FPS);
  const drawFrame = t => { renderAt(hctx, W*S, H*S, t, p, segs); octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = 'high'; octx.fillStyle = '#000'; octx.fillRect(0, 0, W, H); octx.drawImage(hi, 0, 0, W, H); };

  }

async function exportWebCodecs(out, drawFrame, W, H, total, onProg, beforeFrame, bitrate, codecs){
  bitrate = bitrate || Math.max(900000, Math.round(W*H*FPS*1.2));
  let config = null;
  for (const codec of (codecs || ['avc1.42001f', 'avc1.4d001f', 'avc1.640028', 'avc1.42E01E'])){
    const c = { codec, width:W, height:H, bitrate, framerate:FPS };
    try { const sup = await VideoEncoder.isConfigSupported(c); if (sup && sup.supported){ config = c; break; } } catch (e){}
  }
  if (!config) throw new Error('Codec H.264 non disponibile');
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec:'avc', width:W, height:H }, fastStart:'in-memory', firstTimestampBehavior:'offset' });
  let encErr = null;

  enc.configure(config);
  for (let i = 0; i < total; i++){
    if (encErr) throw encErr;
    if (beforeFrame) await beforeFrame(i / FPS);
    drawFrame(i / FPS);
    const frame = new VideoFrame(out, { timestamp: Math.round(i*1e6/FPS), duration: Math.round(1e6/FPS) });
    enc.encode(frame, { keyFrame: i % (FPS*2) === 0 }); frame.close();
    if (i % 6 === 0){ onProg(i/total); await new Promise(r => setTimeout(r, 0)); }
    while (enc.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 4));
  }
  await enc.flush(); if (encErr) throw encErr;
  muxer.finalize(); enc.close(); onProg(1);
  return { blob: new Blob([muxer.target.buffer], { type:'video/mp4' }), ext:'mp4' };
}
function exportRecorder(out, drawFrame, dur, onProg, liveSync, bitrate){
  return new Promise((resolve, reject) => {
    if (typeof MediaRecorder === 'undefined' || !out.captureStream){ reject(new Error('Registrazione video non supportata')); return; }
    const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e){ return false; } });

    const chunks = [];

    rec.onstop = () => resolve({ blob: new Blob(chunks, { type: mime.split(';')[0] }), ext: mime.indexOf('mp4') > -1 ? 'mp4' : 'webm' });
    rec.onerror = e => reject(e.error || new Error('Errore di registrazione'));
    rec.start(500);
    const t0 = performance.now();
    const loop = () => {
      const t = (performance.now() - t0)/1000;
      if (t >= dur){ drawFrame(dur - .001); onProg(1); setTimeout(() => rec.stop(), 150); return; }
      if (liveSync) liveSync(t);
      drawFrame(t); onProg(t/dur); requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}

    const res = await exportRender(p, pr => { const v = Math.round(clamp(pr, 0, 1)*100); fill.style.width = v + '%'; status.textContent = v + '%'; });
    const file = (typeof File === 'function') ? new File([res.blob], res.name, { type: res.blob.type || 'video/mp4' }) : null;
    const canShare = !downloadsNS && file && navigator.canShare && (() => { try { return navigator.canShare({ files:[file] }); } catch (e){ return false; } })();
    const size = res.blob.size > 1048576 ? num((res.blob.size/1048576).toFixed(1)) + ' MB' : Math.max(1, Math.round(res.blob.size/1024)) + ' KB';
    $('#ex-modal').innerHTML = MARK + '<h3>Il render è pronto</h3>' +
      '<p class="file-name">' + esc(res.name) + '</p><p>' + size + ', ' + res.W + ' × ' + res.H + ' pixel, ' + p.duration + ' secondi, senza audio.</p>' +
      (res.ext !== 'mp4' ? '<p class="warn">Questo browser ha creato il video in formato .webm. Per un MP4 riprova da Chrome aggiornato o da Safari su iPhone.</p>' : '') +
      '<div class="stack" style="gap:8px;margin-top:12px"><button class="btn btn-primary btn-block" id="ex-dl">' + IC.download + 'Scarica il render</button>' +
      (canShare ? '<button class="btn btn-secondary btn-block" id="ex-share">Invia al cliente</button>' : '') + '</div>' +
      '<p class="hint small" style="margin-top:12px">Mandalo al cliente su WhatsApp o per email: vedrà la sua attività con l\'insegna già accesa.</p>' +
      '<div style="margin-top:10px">' + offersBtn(p, 'ex-offers') + '</div>' +
      '<button class="btn btn-ghost btn-block" id="ex-close">Chiudi</button>';
    $('#ex-dl').onclick = async () => { const r = await saveBlob(res.blob, res.name); if (r === 'saved') toast('Render scaricato'); else if (r === 'busy') toast('Conferma la richiesta di download già aperta.'); };
    const sh = $('#ex-share');
    if (sh) sh.onclick = async () => { try { await navigator.share({ files:[file], title: res.name }); } catch (e){ if (e && e.name !== 'AbortError') toast('Condivisione non riuscita: usa Scarica il render.'); } };
    $('#ex-close').onclick = () => { closeModal(); go(back); };
    await saveNow();
  } catch (e){
    console.error(e);
    $('#ex-modal').innerHTML = MARK + '<h3>Il render non è stato creato</h3><p>Questo browser non riesce a generare il video. Aggiorna il browser (Chrome o Safari) e riprova.</p><button class="btn btn-primary btn-block" id="ex-close">Chiudi</button>';
    $('#ex-close').onclick = () => { closeModal(); go(back); };
  }
}

/* =====================================================================
   AVVIO
   ===================================================================== */
let rsT = 0, placeWidth = 0;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { const w = $('#pwrap'); if (view === 'place' && w && Math.abs(w.clientWidth - placeWidth) > 40 && !modalRoot.innerHTML) go('place'); }, 300); });
go('home');
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.hostname)){
  window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js').catch(() => {}); });
}
})();
</script>
